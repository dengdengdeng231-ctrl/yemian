<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务配置｜PC端与H5端原型及需求文档</title>
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7fb;color:#172033;overflow:hidden}
  .shell{height:100vh;display:grid;grid-template-rows:72px minmax(0,1fr)}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 20px;background:#fff;border-bottom:1px solid #e5ebf3;box-shadow:0 6px 20px rgba(20,33,61,.06);z-index:2}

  .title p{margin:5px 0 0;color:#7b8799;font-size:12px;font-weight:700}
  .switch{display:grid;grid-template-columns:repeat(2,96px);gap:5px;padding:4px;border:1px solid #e1e8f1;border-radius:13px;background:#f2f5f9}
  .tab{height:38px;border:0;border-radius:9px;background:transparent;color:#718096;font-size:14px;font-weight:900;cursor:pointer}

  .stage{position:relative;min-width:0;min-height:0;background:#f4f7fb}
  .view{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
  .view.active{display:block}
  @media(max-width:720px){.shell{grid-template-rows:106px minmax(0,1fr)}.toolbar{align-items:stretch;flex-direction:column;padding:10px 12px;gap:8px}.title p{display:none}.switch{width:100%;grid-template-columns:1fr 1fr}}
</style>
</head>

    <div class="switch" role="tablist">
      <button id="pcTab" class="tab active" type="button" onclick="showPlatform('pc')">PC端</button>
      <button id="h5Tab" class="tab" type="button" onclick="showPlatform('h5')">H5端</button>
    </div>
  </header>
  <main class="stage">
    <iframe id="pcView" class="view active" title="PC端原型及需求文档" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;zh-CN&quot;&gt;

  &lt;title&gt;任务配置 - PC端原型及需求文档&lt;/title&gt;
  &lt;style&gt;
    :root {

      min-width: calc(var(--sidebar) + 900px + 430px);

                &lt;/div&gt;
                &lt;div class=&quot;tag-linkage-tip&quot;&gt;场馆标签模版与标签文案为关联配置：两项都不配置时，用户端不展示标签；仅配置其中一项时不能保存。&lt;/div&gt;
              &lt;/section&gt;

    &lt;aside class=&quot;requirement-panel&quot;&gt;
      &lt;article class=&quot;requirement-doc venue-doc&quot;&gt;
        &lt;header class=&quot;requirement-doc-header&quot;&gt;
          &lt;div class=&quot;requirement-doc-kicker&quot;&gt;需求文档&lt;/div&gt;
          &lt;h2&gt;新增：场馆LOGO配置 / 场馆标签配置&lt;/h2&gt;
          &lt;div class=&quot;requirement-doc-subtitle&quot;&gt;仅说明本次新增的两个功能；其他既有功能不在本文档范围内。&lt;/div&gt;
        &lt;/header&gt;

        &lt;div class=&quot;requirement-doc-body&quot;&gt;
          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;一、需求背景&lt;/h3&gt;
            &lt;p&gt;站点后台需要给用户端场馆展示补充两个配置能力：场馆 LOGO 和场馆标签。后台配置成功后，用户端对应位置展示；后台未配置时，用户端不展示占位内容。&lt;/p&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;二、新增功能&lt;/h3&gt;
            &lt;div class=&quot;req-mini-grid&quot;&gt;
              &lt;div class=&quot;req-mini-card&quot;&gt;
                &lt;div class=&quot;req-mini-card-title&quot;&gt;场馆LOGO配置&lt;/div&gt;
                &lt;p&gt;编辑场馆页上传 LOGO；列表展示配置结果；用户端场馆切换入口展示。&lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-mini-card&quot;&gt;
                &lt;div class=&quot;req-mini-card-title&quot;&gt;场馆标签配置&lt;/div&gt;
                &lt;p&gt;编辑场馆页选择标签模版并填写文案；列表和用户端场馆卡片展示标签。&lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;三、配置规则&lt;/h3&gt;
            &lt;div class=&quot;req-rule-stack&quot;&gt;
              &lt;div class=&quot;req-rule-row&quot;&gt;
                &lt;div class=&quot;req-rule-key&quot;&gt;LOGO&lt;/div&gt;
                &lt;div&gt;非必填；支持 webp / jpg / png；100KB 以内；未上传时列表显示「-」，用户端不展示。&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-rule-row&quot;&gt;
                &lt;div class=&quot;req-rule-key&quot;&gt;LOGO交互&lt;/div&gt;
                &lt;div&gt;点击上传框选择图片；上传后显示缩略图；可点击眼睛预览；可点击右上角 × 清空。&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-rule-row&quot;&gt;
                &lt;div class=&quot;req-rule-key&quot;&gt;标签模版&lt;/div&gt;
                &lt;div&gt;纯色模版，无文案；初始未选中；点击选中，再次点击同一模版取消选中。&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-rule-row&quot;&gt;
                &lt;div class=&quot;req-rule-key&quot;&gt;标签文案&lt;/div&gt;
                &lt;div&gt;支持中文、英文、数字、字符；最长 6 个字符；预览区展示「模版样式 + 文案」。&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;四、标签保存逻辑&lt;/h3&gt;
            &lt;div class=&quot;logic-list&quot;&gt;
              &lt;div class=&quot;logic-item&quot;&gt;
                &lt;span class=&quot;logic-mark ok&quot;&gt;✓&lt;/span&gt;
                &lt;div&gt;&lt;strong&gt;模版为空 + 文案为空：&lt;/strong&gt;允许保存；后台列表显示「-」，用户端不展示。&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;logic-item&quot;&gt;
                &lt;span class=&quot;logic-mark bad&quot;&gt;×&lt;/span&gt;
                &lt;div&gt;&lt;strong&gt;只选择模版：&lt;/strong&gt;不允许保存；提示「请填写标签文案」。&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;logic-item&quot;&gt;
                &lt;span class=&quot;logic-mark bad&quot;&gt;×&lt;/span&gt;
                &lt;div&gt;&lt;strong&gt;只填写文案：&lt;/strong&gt;不允许保存；提示「请选择标签模版」。&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;logic-item&quot;&gt;
                &lt;span class=&quot;logic-mark ok&quot;&gt;✓&lt;/span&gt;
                &lt;div&gt;&lt;strong&gt;模版 + 文案都有：&lt;/strong&gt;允许保存；后台列表和用户端均展示标签。&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;五、开发/测试验收重点&lt;/h3&gt;
            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;后台未上传 LOGO 时，用户端不展示 LOGO。&lt;/li&gt;
              &lt;li&gt;后台上传并保存 LOGO 后，用户端展示对应 LOGO。&lt;/li&gt;
              &lt;li&gt;LOGO 格式或大小不符合规则时，需要阻止上传并提示。&lt;/li&gt;
              &lt;li&gt;标签模版和标签文案只配置一项时，不能保存成功。&lt;/li&gt;
              &lt;li&gt;标签模版和标签文案都配置后，后台列表和用户端都展示标签。&lt;/li&gt;
              &lt;li&gt;标签模版和标签文案都为空时允许保存，用户端不展示标签。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;六、异常提示&lt;/h3&gt;
            &lt;div class=&quot;req-chip-row&quot;&gt;
              &lt;span class=&quot;req-chip danger&quot;&gt;仅支持 webp/jpg/png&lt;/span&gt;
              &lt;span class=&quot;req-chip danger&quot;&gt;文件不能超过100KB&lt;/span&gt;
              &lt;span class=&quot;req-chip warning&quot;&gt;请填写标签文案&lt;/span&gt;
              &lt;span class=&quot;req-chip warning&quot;&gt;请选择标签模版&lt;/span&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;

      &lt;article class=&quot;requirement-doc game-doc&quot;&gt;
        &lt;header class=&quot;requirement-doc-header&quot;&gt;
          &lt;div class=&quot;requirement-doc-kicker&quot;&gt;需求文档&lt;/div&gt;
          &lt;h2&gt;新增：游戏标签配置&lt;/h2&gt;
          &lt;div class=&quot;requirement-doc-subtitle&quot;&gt;仅说明本次新增的「游戏标签」功能；列表、查询等既有能力沿用原站点游戏管理规则。&lt;/div&gt;
        &lt;/header&gt;

        &lt;div class=&quot;requirement-doc-body&quot;&gt;
          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;一、需求背景&lt;/h3&gt;
            &lt;p&gt;站点后台需要支持给单个游戏配置标签，配置成功后在用户端游戏卡片左上角展示。未配置完整标签数据时，用户端不展示标签占位。&lt;/p&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;二、新增功能&lt;/h3&gt;
            &lt;div class=&quot;req-mini-grid&quot;&gt;
              &lt;div class=&quot;req-mini-card&quot;&gt;
                &lt;div class=&quot;req-mini-card-title&quot;&gt;游戏标签配置&lt;/div&gt;
                &lt;p&gt;在编辑游戏页选择标签模版，并填写标签文案。&lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-mini-card&quot;&gt;
                &lt;div class=&quot;req-mini-card-title&quot;&gt;游戏标签展示&lt;/div&gt;
                &lt;p&gt;保存成功后，后台列表展示标签；用户端游戏卡片展示标签。&lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;三、配置规则&lt;/h3&gt;
            &lt;div class=&quot;req-rule-stack&quot;&gt;
              &lt;div class=&quot;req-rule-row&quot;&gt;
                &lt;div class=&quot;req-rule-key&quot;&gt;模版样式&lt;/div&gt;
                &lt;div&gt;模版为纯色样式，模版选择区不展示文案。&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-rule-row&quot;&gt;
                &lt;div class=&quot;req-rule-key&quot;&gt;选择交互&lt;/div&gt;
                &lt;div&gt;初始全部未选中；第一次点击为选中，再次点击同一模版为取消选中。&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-rule-row&quot;&gt;
                &lt;div class=&quot;req-rule-key&quot;&gt;标签文案&lt;/div&gt;
                &lt;div&gt;支持中文、英文、数字、字符；最长 6 个字符。&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-rule-row&quot;&gt;
                &lt;div class=&quot;req-rule-key&quot;&gt;预览效果&lt;/div&gt;
                &lt;div&gt;预览区展示「模版样式 + 标签文案」；未选择模版时提示请选择标签模版。&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;四、保存逻辑&lt;/h3&gt;
            &lt;div class=&quot;logic-list&quot;&gt;
              &lt;div class=&quot;logic-item&quot;&gt;
                &lt;span class=&quot;logic-mark ok&quot;&gt;✓&lt;/span&gt;
                &lt;div&gt;&lt;strong&gt;模版为空 + 文案为空：&lt;/strong&gt;允许保存；后台列表显示「-」，用户端不展示。&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;logic-item&quot;&gt;
                &lt;span class=&quot;logic-mark bad&quot;&gt;×&lt;/span&gt;
                &lt;div&gt;&lt;strong&gt;只选择模版：&lt;/strong&gt;不允许保存；提示「请填写标签文案」。&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;logic-item&quot;&gt;
                &lt;span class=&quot;logic-mark bad&quot;&gt;×&lt;/span&gt;
                &lt;div&gt;&lt;strong&gt;只填写文案：&lt;/strong&gt;不允许保存；提示「请选择标签模版」。&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;logic-item&quot;&gt;
                &lt;span class=&quot;logic-mark ok&quot;&gt;✓&lt;/span&gt;
                &lt;div&gt;&lt;strong&gt;模版 + 文案都有：&lt;/strong&gt;允许保存；后台列表和用户端均展示标签。&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;五、开发/测试验收重点&lt;/h3&gt;
            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;游戏标签模版初始状态均为未选中。&lt;/li&gt;
              &lt;li&gt;点击模版可选中，再次点击同一模版可取消选中。&lt;/li&gt;
              &lt;li&gt;标签文案最多允许输入 6 个字符。&lt;/li&gt;
              &lt;li&gt;只配置模版或只配置文案时，均不能保存成功。&lt;/li&gt;
              &lt;li&gt;模版和文案都配置后，后台列表展示游戏标签。&lt;/li&gt;
              &lt;li&gt;后台配置完整游戏标签后，用户端游戏卡片展示标签。&lt;/li&gt;
              &lt;li&gt;后台未配置完整标签时，用户端不展示标签。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;六、异常提示&lt;/h3&gt;
            &lt;div class=&quot;req-chip-row&quot;&gt;
              &lt;span class=&quot;req-chip warning&quot;&gt;请填写标签文案&lt;/span&gt;
              &lt;span class=&quot;req-chip warning&quot;&gt;请选择标签模版&lt;/span&gt;
              &lt;span class=&quot;req-chip&quot;&gt;保存失败，请稍后重试&lt;/span&gt;
            &lt;/div&gt;

      &lt;article class=&quot;requirement-doc payment-doc active&quot; data-payment-doc=&quot;label&quot;&gt;
        &lt;header class=&quot;requirement-doc-header&quot;&gt;
          &lt;div class=&quot;requirement-doc-kicker&quot;&gt;超详细需求文档&lt;/div&gt;
          &lt;h2&gt;充值管理 / 标签&lt;/h2&gt;
          &lt;div class=&quot;requirement-doc-subtitle&quot;&gt;配置用户端充值页顶部标签，并决定标签下展示哪些充值通道或通道组。&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;requirement-doc-body&quot;&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;一、功能定位&lt;/h3&gt;
            &lt;p&gt;标签管理用于维护用户端充值页面顶部的一级充值分类，例如「热门」「钱包」。它本身不创建订单，也不直接对接三方支付；它的作用是把后台配置好的【通道】或【通道组】聚合成用户端可点击的分类入口。&lt;/p&gt;
            &lt;div class=&quot;req-deep-summary&quot;&gt;
              &lt;div class=&quot;req-deep-card&quot;&gt;&lt;strong&gt;一句话理解：&lt;/strong&gt;标签 = 用户端充值页顶部分类；标签下面展示哪些充值入口，由标签绑定的通道分类和通道组分类决定。&lt;/div&gt;
              &lt;div class=&quot;req-deep-card&quot;&gt;&lt;strong&gt;用户端位置：&lt;/strong&gt;充值页顶部 Tab，如截图中的「热门 / 钱包」。用户切换标签时，下面的充值卡片列表随标签变化。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;二、完整流程图&lt;/h3&gt;
            &lt;div class=&quot;req-flow&quot;&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;1&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;后台新增 / 编辑标签&lt;/span&gt;运营填写排序、标签名称、状态，并选择关联的通道分类或通道组分类。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;2&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;后端保存配置&lt;/span&gt;保存标签基础信息、关联通道 ID、关联通道组 ID；状态为停用时仍保存数据，但不参与用户端展示。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;3&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;用户进入充值页&lt;/span&gt;前端请求充值配置接口，后端读取所有启用状态的标签，并按排序升序返回。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;4&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;后端过滤标签下数据&lt;/span&gt;根据标签关联关系，取出可用通道 / 通道组，再结合通道状态、支付渠道状态、展示配置、小额充值限制等规则二次过滤。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;5&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;前端渲染标签&lt;/span&gt;用户端顶部显示可用标签；默认选中排序最小且有可用数据的标签。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;6&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;用户切换标签&lt;/span&gt;前端展示该标签下的充值卡片；如果标签下无可用通道，前端展示暂无可用充值方式或隐藏该标签。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;三、字段说明&lt;/h3&gt;
            &lt;div class=&quot;req-field-list&quot;&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;排序&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;控制用户端标签展示顺序。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;规则&lt;/b&gt;&lt;span&gt;数字越小越靠前；建议只允许正整数；保存时需校验不能为空。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;前端&lt;/b&gt;&lt;span&gt;用户端顶部标签按排序升序展示。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;测试&lt;/b&gt;&lt;span&gt;修改排序后刷新用户端，标签顺序应同步变化。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;标签名称&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;用户端顶部分类文案，例如「热门」「钱包」。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;规则&lt;/b&gt;&lt;span&gt;不能为空；建议限制长度，避免用户端标签挤压；同一站点下建议不允许重名。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;前端&lt;/b&gt;&lt;span&gt;直接展示为充值页顶部 Tab 文案。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;状态&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;取值&lt;/b&gt;&lt;span&gt;启用 / 停用，新增默认启用。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;启用&lt;/b&gt;&lt;span&gt;可在用户端展示，并可被默认选中。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;停用&lt;/b&gt;&lt;span&gt;用户端不展示；已进入该标签的用户刷新后应自动切换到其他可用标签。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;后端&lt;/b&gt;&lt;span&gt;充值配置接口不应返回停用状态标签。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;通道分类&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;非必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;数据来源&lt;/b&gt;&lt;span&gt;来源于【通道管理】列表中已存在的通道数据。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;把单个充值通道挂到当前标签下。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;筛选&lt;/b&gt;&lt;span&gt;选择时应展示通道名称，可支持搜索；建议只显示未删除数据。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用户端&lt;/b&gt;&lt;span&gt;当前标签下展示这些通道对应的充值卡片，仍需经过通道状态、展示配置、金额规则过滤。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;通道分类组&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;非必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;数据来源&lt;/b&gt;&lt;span&gt;来源于【通道组管理】中已配置的通道组。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;把一组充值通道挂到当前标签下，便于批量展示。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用户端&lt;/b&gt;&lt;span&gt;点击标签后，展示通道组内符合条件的通道或按组展示充值入口。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;注意&lt;/b&gt;&lt;span&gt;通道分类和通道分类组可至少选择其中一项；如果都为空，标签保存后用户端可能无数据。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;备注&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;非必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;后台备注说明，只给运营、开发、测试查看，不展示给用户端。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;四、业务规则&lt;/h3&gt;
            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;新增标签时，所有字段初始为空，状态默认启用。&lt;/li&gt;
              &lt;li&gt;编辑标签时，回显排序、名称、状态、已关联通道、已关联通道组、备注。&lt;/li&gt;
              &lt;li&gt;删除标签需要二次确认；删除后用户端不再展示该标签，但不应删除通道和通道组本身。&lt;/li&gt;
              &lt;li&gt;标签停用后，充值配置接口不返回该标签；前端不能继续从缓存展示停用标签。&lt;/li&gt;
              &lt;li&gt;标签下通道如果全部不可用，后端可不返回该标签，或前端展示暂无可用充值方式，最终以产品确认的策略为准。&lt;/li&gt;
              &lt;li&gt;同一通道可被多个标签关联；用户端展示时应按当前选中的标签范围加载。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;五、验收重点&lt;/h3&gt;
            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;新增、编辑、启停、删除标签后，用户端充值页标签展示正确变化。&lt;/li&gt;
              &lt;li&gt;标签关联通道和通道组后，用户端只展示当前标签范围内的数据。&lt;/li&gt;
              &lt;li&gt;停用标签不影响通道本身状态；其他标签仍可继续展示同一通道。&lt;/li&gt;
              &lt;li&gt;标签排序修改后，用户端刷新应按新排序展示。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;requirement-doc payment-doc&quot; data-payment-doc=&quot;channel&quot;&gt;
        &lt;header class=&quot;requirement-doc-header&quot;&gt;
          &lt;div class=&quot;requirement-doc-kicker&quot;&gt;超详细需求文档&lt;/div&gt;
          &lt;h2&gt;充值管理 / 渠道管理&lt;/h2&gt;
          &lt;div class=&quot;requirement-doc-subtitle&quot;&gt;维护三方支付厂商接入参数，供通道下单时读取。&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;requirement-doc-body&quot;&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;一、功能定位&lt;/h3&gt;
            &lt;p&gt;渠道管理用于维护三方支付厂商接入参数，例如商户 ID、商户密钥、网关地址、公私钥。它不直接展示给用户端，但通道管理会选择某个支付渠道作为后端下单时的实际支付厂商。&lt;/p&gt;
            &lt;div class=&quot;req-formula req-warning&quot;&gt;&lt;strong&gt;核心理解：&lt;/strong&gt;渠道管理 = 三方支付厂商配置；通道管理 = 用户端充值入口。用户端看到的是通道，不一定看到渠道名称。&lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;二、完整流程图&lt;/h3&gt;
            &lt;div class=&quot;req-flow&quot;&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;1&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;后台维护支付渠道&lt;/span&gt;运营 / 技术填写三方支付厂商名称、商户 ID、商户账号、密钥、网关、公私钥等信息。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;2&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;通道绑定支付渠道&lt;/span&gt;在【通道管理】新增充值通道时，选择这里配置好的支付渠道。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;3&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;用户选择充值通道&lt;/span&gt;用户端选择某个充值卡片并提交充值金额。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;4&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;后端读取渠道参数&lt;/span&gt;后端根据通道绑定关系找到支付渠道，读取商户 ID、密钥、网关等参数。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;5&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;调用三方创建订单&lt;/span&gt;后端使用渠道参数签名并请求三方支付网关，获取支付链接、二维码、地址或收款信息。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;6&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;回调与入账&lt;/span&gt;三方支付成功后回调平台；平台校验签名、金额、订单号后给用户入账。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;三、字段说明&lt;/h3&gt;
            &lt;div class=&quot;req-field-list&quot;&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;支付渠道&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;三方支付厂商或支付平台名称，如 LLPay、GoPay、BeePay。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;来源&lt;/b&gt;&lt;span&gt;后台人工配置。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;影响&lt;/b&gt;&lt;span&gt;通道管理选择支付渠道时从这里取数。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;校验&lt;/b&gt;&lt;span&gt;同一站点下建议不允许重复名称，避免通道绑定时混淆。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;商户ID&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;三方平台分配给站点或商户的唯一标识。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;来源&lt;/b&gt;&lt;span&gt;由三方支付平台提供。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;后端&lt;/b&gt;&lt;span&gt;创建订单、查询订单、回调验签时可能会用到。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;商户账号&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;按三方要求&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;部分三方需要商户账号或登录账号作为请求参数。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;规则&lt;/b&gt;&lt;span&gt;若三方不需要则可为空；若当前渠道必需，后端应在保存或下单时校验。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;商户密钥&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;敏感必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;用于请求签名、回调验签、加密通信。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;安全&lt;/b&gt;&lt;span&gt;列表不展示；编辑页建议脱敏显示；提交后由后端加密存储。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;测试&lt;/b&gt;&lt;span&gt;密钥错误时，三方下单应失败或回调验签失败，系统需有明确错误日志。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;网关&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;三方支付接口请求地址。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;来源&lt;/b&gt;&lt;span&gt;由三方支付平台提供，不同环境可能有测试网关和生产网关。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;校验&lt;/b&gt;&lt;span&gt;建议校验 URL 格式；生产环境应使用生产网关。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;我方公钥 / 私钥&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;按三方协议&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;用于非对称加密或签名场景。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;安全&lt;/b&gt;&lt;span&gt;私钥属于高敏字段，不能在列表明文展示，编辑页也建议脱敏。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;规则&lt;/b&gt;&lt;span&gt;如果三方支付不需要公私钥，则可为空。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;备注&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;非必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;记录渠道用途、环境、注意事项，例如“充值生产渠道”“仅用于测试”。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;四、业务规则&lt;/h3&gt;
            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;新增页面字段初始为空；编辑页面回显已保存数据。&lt;/li&gt;
              &lt;li&gt;渠道管理无用户端直接展示，但会影响通道能否成功创建充值订单。&lt;/li&gt;
              &lt;li&gt;修改渠道网关、密钥、商户 ID 后，所有绑定该渠道的通道应使用最新参数。&lt;/li&gt;
              &lt;li&gt;渠道配置不完整时，通道保存可允许，但下单必须拦截并输出清晰错误；更建议在通道启用前校验完整性。&lt;/li&gt;
              &lt;li&gt;敏感字段必须做权限控制，普通运营不应随意查看密钥和私钥明文。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;五、验收重点&lt;/h3&gt;
            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;渠道新增、编辑保存成功后，通道管理的支付渠道下拉能获取到最新数据。&lt;/li&gt;
              &lt;li&gt;商户密钥、私钥不在列表明文显示。&lt;/li&gt;
              &lt;li&gt;绑定该渠道的通道下单时，后端读取的是当前最新渠道参数。&lt;/li&gt;
              &lt;li&gt;网关错误或密钥错误时，充值订单不应误判成功。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;requirement-doc payment-doc&quot; data-payment-doc=&quot;deposit&quot;&gt;
        &lt;header class=&quot;requirement-doc-header&quot;&gt;
          &lt;div class=&quot;requirement-doc-kicker&quot;&gt;超详细需求文档&lt;/div&gt;
          &lt;h2&gt;充值管理 / 渠道押金管理&lt;/h2&gt;
          &lt;div class=&quot;requirement-doc-subtitle&quot;&gt;控制支付渠道代收额度、状态和累计金额，影响关联通道是否可继续收款。&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;requirement-doc-body&quot;&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;一、功能定位&lt;/h3&gt;
            &lt;p&gt;渠道押金管理用于维护支付渠道的代收额度、当前代收金额、历史累计金额和可用状态。它是支付风控和运营控制功能，目的是避免某个支付渠道额度不足或停用后，用户仍然通过该渠道下单。&lt;/p&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;二、完整流程图&lt;/h3&gt;
            &lt;div class=&quot;req-flow&quot;&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;1&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;后台配置渠道押金&lt;/span&gt;选择支付渠道，设置代收限额、状态和备注。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;2&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;用户请求充值配置&lt;/span&gt;后端加载通道时，同时检查该通道绑定的支付渠道押金状态和额度。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;3&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;判断渠道是否可用&lt;/span&gt;如果状态停用，或当前代收总额达到 / 超过代收限额，则该渠道不可用。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;4&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;过滤用户端通道&lt;/span&gt;不可用渠道下的充值通道应隐藏，或至少在用户提交时提示“当前充值方式不可用”。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;5&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;充值成功后累计&lt;/span&gt;充值订单成功入账后，按实际成功金额累计到代收总额和历史累计代收总额。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;6&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;额度达到上限&lt;/span&gt;后续用户请求充值配置或提交订单时，系统不再允许该渠道继续收款。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;三、字段说明&lt;/h3&gt;
            &lt;div class=&quot;req-field-list&quot;&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;支付渠道&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;数据来源&lt;/b&gt;&lt;span&gt;来源于【渠道管理】已配置的支付渠道。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;指定要控制额度和状态的三方支付渠道。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;影响&lt;/b&gt;&lt;span&gt;该渠道下所有绑定通道都会受此配置影响。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;代收限额&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;含义&lt;/b&gt;&lt;span&gt;当前渠道允许代收的金额上限。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;规则&lt;/b&gt;&lt;span&gt;代收总额 + 本次充值金额如果超过代收限额，后端应拒绝下单或切换其他可用通道。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;校验&lt;/b&gt;&lt;span&gt;必须为大于等于 0 的数字。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;代收总额&lt;/span&gt;&lt;span class=&quot;req-pill back&quot;&gt;系统累计&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;来源&lt;/b&gt;&lt;span&gt;充值订单成功入账后由系统累计，不建议人工随意修改。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;判断当前渠道是否已经达到代收限额。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;不计入&lt;/b&gt;&lt;span&gt;失败、取消、超时、未支付订单不应计入。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;历史累计代收总额&lt;/span&gt;&lt;span class=&quot;req-pill back&quot;&gt;系统累计&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;来源&lt;/b&gt;&lt;span&gt;历史所有成功代收金额累计。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;用于运营统计渠道长期代收能力，不直接作为当前可用额度判断依据，除非后端另有规则。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;状态&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;启用&lt;/b&gt;&lt;span&gt;渠道可参与充值展示和下单，但仍需判断额度是否足够。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;停用&lt;/b&gt;&lt;span&gt;该支付渠道不可用于充值；关联通道用户端不展示或提交时拦截。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;新增&lt;/b&gt;&lt;span&gt;新增页面状态默认启用。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;备注 / 创建人 / 操作人 / 时间&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;记录字段&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;备注&lt;/b&gt;&lt;span&gt;后台说明，不展示给用户。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;时间&lt;/b&gt;&lt;span&gt;创建时间、操作时间由系统记录，用于追踪配置变更。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;四、后端判断逻辑&lt;/h3&gt;
            &lt;div class=&quot;req-formula&quot;&gt;
              &lt;strong&gt;可用判断：&lt;/strong&gt;&lt;br&gt;
              渠道状态 = 启用 且 代收总额 + 本次充值金额 ≤ 代收限额，则允许继续使用；否则该渠道不可用。
            &lt;/div&gt;
            &lt;ul class=&quot;req-list&quot; style=&quot;margin-top:10px;&quot;&gt;
              &lt;li&gt;用户端充值页加载时，后端应过滤不可用渠道下的通道。&lt;/li&gt;
              &lt;li&gt;用户点击确定创建订单时，后端必须再次校验额度，防止加载后额度被其他订单占用。&lt;/li&gt;
              &lt;li&gt;充值成功入账后再累计代收总额；未支付订单不能提前永久占用额度，是否临时冻结额度由后端策略决定。&lt;/li&gt;
              &lt;li&gt;如果多个用户同时下单，后端需要防并发超额。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;五、验收重点&lt;/h3&gt;
            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;停用渠道押金状态后，关联通道不能继续成功下单。&lt;/li&gt;
              &lt;li&gt;代收总额达到限额后，用户端不应继续展示或允许提交该渠道通道。&lt;/li&gt;
              &lt;li&gt;充值成功后，代收总额和历史累计代收总额正确增加。&lt;/li&gt;
              &lt;li&gt;失败订单、取消订单、超时订单不应错误累计额度。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;requirement-doc payment-doc&quot; data-payment-doc=&quot;route&quot;&gt;
        &lt;header class=&quot;requirement-doc-header&quot;&gt;
          &lt;div class=&quot;requirement-doc-kicker&quot;&gt;超详细需求文档&lt;/div&gt;
          &lt;h2&gt;充值管理 / 通道管理&lt;/h2&gt;
          &lt;div class=&quot;requirement-doc-subtitle&quot;&gt;充值管理核心功能，控制用户端充值入口、金额、优惠、展示范围和三方下单参数。&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;requirement-doc-body&quot;&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;一、功能定位&lt;/h3&gt;
            &lt;p&gt;通道管理是充值管理的核心。用户端看到的每一个充值卡片，例如「234钱包」「808钱包」「UCpayUSDT」，都来源于通道管理或通道组下的通道配置。它同时控制用户端展示、金额限制、优惠、三方下单参数和用户可见范围。&lt;/p&gt;
            &lt;div class=&quot;req-deep-summary&quot;&gt;
              &lt;div class=&quot;req-deep-card&quot;&gt;&lt;strong&gt;一句话理解：&lt;/strong&gt;通道 = 用户真实选择并提交充值订单的入口。&lt;/div&gt;
              &lt;div class=&quot;req-deep-card&quot;&gt;&lt;strong&gt;和渠道管理区别：&lt;/strong&gt;渠道管理是三方支付厂商参数；通道管理是用户端充值入口，通道会绑定某个支付渠道。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;二、完整业务流程图&lt;/h3&gt;
            &lt;div class=&quot;req-flow&quot;&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;1&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;后台配置通道&lt;/span&gt;运营填写支付渠道、支付方式、金额区间、支付参数、展示配置、通道名称、图片、优惠规则等。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;2&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;标签 / 通道组关联&lt;/span&gt;标签管理可直接关联通道，也可关联通道组；通道也可归属到某个通道组。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;3&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;用户进入充值页&lt;/span&gt;后端按标签、通道组、通道状态、支付渠道状态、展示配置、小额限制、押金额度过滤可见通道。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;4&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;前端渲染充值卡片&lt;/span&gt;展示通道名称、通道图片、标签文本、限额、快捷金额、协议、汇率等。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;5&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;用户选择通道并输入金额&lt;/span&gt;前端根据区间金额、快捷金额、自定义金额开关做基础校验。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;6&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;后端创建充值订单&lt;/span&gt;后端再次校验用户权限、金额、通道状态、渠道额度、优惠规则，然后调用三方支付。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;7&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;支付回调和入账&lt;/span&gt;三方回调后，平台校验签名、金额和订单状态，成功后给用户余额入账并生成账变。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;三、基础配置字段&lt;/h3&gt;
            &lt;div class=&quot;req-field-list&quot;&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;支付渠道&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;来源&lt;/b&gt;&lt;span&gt;来源于【渠道管理】。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;决定后端创建订单时调用哪家三方支付厂商。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;校验&lt;/b&gt;&lt;span&gt;所选支付渠道必须存在且未被删除；如渠道参数缺失，下单需拦截。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;支付方式&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;取值&lt;/b&gt;&lt;span&gt;银行卡、支付宝、微信、USDT、电子钱包等。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;决定用户端充值表单形态，例如 USDT 会展示协议和汇率，普通钱包展示 CNY 金额和快捷金额。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;查询&lt;/b&gt;&lt;span&gt;通道管理列表支持按支付方式筛选。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;所属通道组&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;非必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;来源&lt;/b&gt;&lt;span&gt;来源于【通道组管理】。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;将当前通道归属到某个通道组，便于标签按组展示。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;规则&lt;/b&gt;&lt;span&gt;未选择时，该通道仍可被标签直接关联展示。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;排序&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;控制用户端通道卡片排序。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;规则&lt;/b&gt;&lt;span&gt;数字越小越靠前；建议正整数。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;状态&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;启用&lt;/b&gt;&lt;span&gt;允许用户端展示和下单。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;停用&lt;/b&gt;&lt;span&gt;用户端不展示，后端也必须禁止创建订单。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;新增&lt;/b&gt;&lt;span&gt;默认启用。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;备注&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;非必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;后台说明，不展示给用户。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;四、金额配置字段&lt;/h3&gt;
            &lt;div class=&quot;req-field-list&quot;&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;区间金额&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;配置该通道允许用户充值的最小金额和最大金额。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用户端&lt;/b&gt;&lt;span&gt;展示为“限额10-1000000”或“10-100w”等。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;校验&lt;/b&gt;&lt;span&gt;用户输入金额必须 ≥ 最小值 且 ≤ 最大值；后端创建订单必须再次校验。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;快捷金额&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;通道必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;用户端快捷充值按钮，如 100、300、500、1000。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;规则&lt;/b&gt;&lt;span&gt;多个金额用英文逗号分隔；点击按钮后自动填入充值金额。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;注意&lt;/b&gt;&lt;span&gt;通道管理中保持必填；通道组管理中的快捷金额为非必填。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;自定义金额开关&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;启用&lt;/b&gt;&lt;span&gt;用户可手动输入金额，也可点快捷金额。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;停用&lt;/b&gt;&lt;span&gt;用户只能使用快捷金额，不允许手动输入。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;校验&lt;/b&gt;&lt;span&gt;停用时，提交金额必须命中快捷金额列表。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;额度配置&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;非必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;针对不同总代 / 渠道配置特殊充值额度。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;字段&lt;/b&gt;&lt;span&gt;配置范围（总代 / 渠道）、额度范围（最小值 - 最大值）、操作（删除）。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;优先级&lt;/b&gt;&lt;span&gt;命中用户所属总代 / 渠道时，优先使用额度配置；未命中则使用默认区间金额。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;五、优惠区间金额&lt;/h3&gt;
            &lt;div class=&quot;req-flow&quot;&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;1&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;开关停用&lt;/span&gt;不展示标签文本和优惠配置表格；用户端通道卡片不展示“送2%”之类标签；充值成功后不计算优惠。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;2&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;开关启用&lt;/span&gt;展示标签文本和优惠配置表格；用户端可显示优惠标签；后端按会员、金额区间、优惠方式计算赠送彩金。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;3&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;用户充值命中优惠&lt;/span&gt;用户会员类型匹配，充值金额在优惠区间内，则根据优惠方式计算赠送金额。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;4&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;奖金上限和打码&lt;/span&gt;赠送金额不能超过奖金上限；发放优惠后生成对应打码要求。&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;req-mini-title&quot;&gt;优惠配置字段&lt;/div&gt;
            &lt;div class=&quot;req-field-list&quot;&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;标签文本&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;非必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;用户端充值卡片右上角展示，如“送2%”。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;展示&lt;/b&gt;&lt;span&gt;只有优惠区间金额启用时才展示该字段；停用后隐藏。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;会员&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;配置项&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;选项&lt;/b&gt;&lt;span&gt;所有、首充玩家、大玩家、测试。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;限制哪些用户可享受该优惠。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;充值金额区间&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;配置项&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;判断用户本次充值金额是否命中优惠。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;校验&lt;/b&gt;&lt;span&gt;最小值 ≤ 充值金额 ≤ 最大值。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;优惠方式 / 优惠方案&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;配置项&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;优惠方式&lt;/b&gt;&lt;span&gt;百分比 / 固定金额。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;优惠方案&lt;/b&gt;&lt;span&gt;每次 / 每日首次 / 仅首次，用于判断赠送频次。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;赠送金额 / 奖金上限 / 打码倍数&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;配置项&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;赠送金额&lt;/b&gt;&lt;span&gt;百分比时表示比例，例如 2 表示 2%；固定金额时表示直接赠送金额。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;奖金上限&lt;/b&gt;&lt;span&gt;赠送金额超过上限时，按上限发放。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;打码倍数&lt;/b&gt;&lt;span&gt;优惠彩金发放后产生对应流水要求。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;req-formula&quot; style=&quot;margin-top:10px;&quot;&gt;
              &lt;strong&gt;百分比优惠示例：&lt;/strong&gt;用户充值 1000，赠送金额配置 2，奖金上限 888，则理论赠送 1000 × 2% = 20，未超过 888，最终赠送 20。
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;六、支付参数字段&lt;/h3&gt;
            &lt;div class=&quot;req-field-list&quot;&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;第三方通道支付代码&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;后端请求三方支付时传给支付厂商的通道代码。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;来源&lt;/b&gt;&lt;span&gt;由三方支付平台提供。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;币别&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;决定用户端金额单位和表单形态，如 CNY、USDT。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用户端&lt;/b&gt;&lt;span&gt;USDT 类展示协议、数量 / 金额购买、参考汇率；CNY 类展示充值金额。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;钱包汇率单位&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;按币种&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;用于钱包 / USDT 充值时展示和换算参考汇率。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;注意&lt;/b&gt;&lt;span&gt;实际入账仍应以后端下单和支付结果为准，前端汇率仅做展示。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;打码倍数&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;充值后产生流水要求；如果赠送优惠，也可能叠加优惠打码。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;厂商手续费 / 手续费率%&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;非必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;记录三方或商户手续费，用于运营成本、通道筛选或小额限制规则。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用户端&lt;/b&gt;&lt;span&gt;是否展示手续费由产品规则决定；当前主要作为后台配置和过滤字段。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;七、展示配置字段&lt;/h3&gt;
            &lt;div class=&quot;req-field-list&quot;&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;展示配置&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;不限制&lt;/b&gt;&lt;span&gt;所有符合其他条件的用户都可见；不展示“展示总代”和“展示渠道”。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;排除&lt;/b&gt;&lt;span&gt;展示“展示总代 / 展示渠道”；被选中的总代或渠道用户不可见。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;包含&lt;/b&gt;&lt;span&gt;展示“展示总代 / 展示渠道”；只有被选中的总代或渠道用户可见。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;展示总代&lt;/span&gt;&lt;span class=&quot;req-pill front&quot;&gt;条件显示&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;显示条件&lt;/b&gt;&lt;span&gt;展示配置选择“排除”或“包含”时出现。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;数据来源&lt;/b&gt;&lt;span&gt;来源于系统总代 / 代理层级数据。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;展示渠道&lt;/span&gt;&lt;span class=&quot;req-pill front&quot;&gt;条件显示&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;显示条件&lt;/b&gt;&lt;span&gt;展示配置选择“排除”或“包含”时出现。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;数据来源&lt;/b&gt;&lt;span&gt;来源于渠道 / 推广渠道数据。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;提示文案 / 链接地址&lt;/span&gt;&lt;span class=&quot;req-pill optional&quot;&gt;非必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;用户端展示充值教程、注意事项或跳转说明。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;八、通道展示信息与只读信息&lt;/h3&gt;
            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;&lt;strong&gt;通道名字：&lt;/strong&gt;必填；用户端充值卡片名称。&lt;/li&gt;
              &lt;li&gt;&lt;strong&gt;通道图片：&lt;/strong&gt;非必填；支持 webp / jpg / png，100KB 内，支持上传、预览、清空。&lt;/li&gt;
              &lt;li&gt;&lt;strong&gt;填写信息：&lt;/strong&gt;仅编辑页面展示“付款人账户、付款人邮箱”，只读不可修改。&lt;/li&gt;
              &lt;li&gt;&lt;strong&gt;删除操作：&lt;/strong&gt;删除通道必须二次确认；删除后用户端不再展示该通道。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;九、后端下单校验清单&lt;/h3&gt;
            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;通道是否存在、是否启用、是否未删除。&lt;/li&gt;
              &lt;li&gt;绑定的支付渠道是否存在，三方参数是否完整。&lt;/li&gt;
              &lt;li&gt;渠道押金状态是否启用，额度是否足够。&lt;/li&gt;
              &lt;li&gt;当前用户所属总代 / 渠道是否符合展示配置。&lt;/li&gt;
              &lt;li&gt;用户输入金额是否满足默认区间或命中的额度配置。&lt;/li&gt;
              &lt;li&gt;自定义金额停用时，提交金额是否为快捷金额。&lt;/li&gt;
              &lt;li&gt;小额充值限制是否会动态提高最低充值金额。&lt;/li&gt;
              &lt;li&gt;优惠区间金额是否启用、会员和金额是否命中优惠。&lt;/li&gt;
              &lt;li&gt;三方支付创建订单是否成功，返回支付信息是否完整。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;requirement-doc payment-doc&quot; data-payment-doc=&quot;smallLimit&quot;&gt;
        &lt;header class=&quot;requirement-doc-header&quot;&gt;
          &lt;div class=&quot;requirement-doc-kicker&quot;&gt;超详细需求文档&lt;/div&gt;
          &lt;h2&gt;充值管理 / 小额充值限制&lt;/h2&gt;
          &lt;div class=&quot;requirement-doc-subtitle&quot;&gt;根据用户历史充值行为动态调整最低充值金额和可展示通道。&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;requirement-doc-body&quot;&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;一、功能定位&lt;/h3&gt;
            &lt;p&gt;小额充值限制用于根据用户历史小额充值行为，动态调整该用户后续可用通道的最低充值金额，并可根据手续费条件过滤通道。它不是修改通道原始配置，而是在用户维度上动态计算最终展示结果。&lt;/p&gt;
            &lt;div class=&quot;req-formula req-warning&quot;&gt;&lt;strong&gt;重点：&lt;/strong&gt;这是用户维度规则。同一个通道，不同用户可能看到不同最低充值金额。&lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;二、完整流程图&lt;/h3&gt;
            &lt;div class=&quot;req-flow&quot;&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;1&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;后台配置规则&lt;/span&gt;运营设置开关、第一步、第二步、第三步中的金额、次数、手续费和最终最低金额。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;2&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;用户成功充值&lt;/span&gt;系统记录用户成功充值订单金额和成功次数；失败、取消、超时不计入。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;3&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;用户再次进入充值页&lt;/span&gt;后端根据该用户历史成功充值记录判断是否命中小额限制规则。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;4&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;动态调整通道&lt;/span&gt;命中后，提高符合条件通道的最低充值金额，或过滤手续费不满足要求的通道。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;5&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;用户端展示结果&lt;/span&gt;用户端看到新的限额，如从 10-1000000 变为 100-1000000。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;6&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;后端创建订单校验&lt;/span&gt;即使前端展示了新限额，后端下单时也必须重新计算并校验，避免绕过前端。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;三、字段说明&lt;/h3&gt;
            &lt;div class=&quot;req-field-list&quot;&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;开关&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;启用&lt;/b&gt;&lt;span&gt;规则生效，用户端充值配置需按用户历史行为动态计算。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;停用&lt;/b&gt;&lt;span&gt;规则不生效，用户端使用通道原始金额配置。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;注意&lt;/b&gt;&lt;span&gt;停用后不应清空规则配置，只是不生效。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;第一步&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;规则字段&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;含义&lt;/b&gt;&lt;span&gt;当用户充值金额小于设定值，并成功充值达到设定次数后，触发最低充值金额调整。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;示例&lt;/b&gt;&lt;span&gt;充值金额小于 100，成功充值 2 次后，将最低充值金额小于 100 的通道最低值改为 100。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;作用&lt;/b&gt;&lt;span&gt;限制频繁使用极小金额充值的用户。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;第二步&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;规则字段&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;含义&lt;/b&gt;&lt;span&gt;当用户充值金额大于等于设定值，并成功充值达到设定次数后，进一步调整低额通道最低金额。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;示例&lt;/b&gt;&lt;span&gt;充值金额大于等于 100，成功充值 999 次后，将最低充值金额小于 200 的通道最低值改为 200。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;作用&lt;/b&gt;&lt;span&gt;对已多次充值用户逐步提高低额通道门槛。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;
                &lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;第三步&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;规则字段&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;req-field-body&quot;&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;含义&lt;/b&gt;&lt;span&gt;根据充值金额、成功次数、手续费阈值共同判断，只显示手续费小于指定比例的通道，并调整最低充值金额。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;示例&lt;/b&gt;&lt;span&gt;充值金额大于等于 200，成功充值 2 次后，只显示手续费小于 10% 的通道，并把最低充值金额小于 100 的通道改为 100。&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;数据来源&lt;/b&gt;&lt;span&gt;手续费来源于【通道管理】中的厂商手续费 / 手续费率配置。&lt;/span&gt;&lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;四、计算规则说明&lt;/h3&gt;
            &lt;div class=&quot;req-formula&quot;&gt;
              &lt;strong&gt;后端应按用户维度计算：&lt;/strong&gt;&lt;br&gt;
              用户历史成功充值订单 → 判断成功次数和金额区间 → 找出命中的限制步骤 → 对可见通道进行最低金额调整和手续费过滤 → 返回给前端。
            &lt;/div&gt;
            &lt;ul class=&quot;req-list&quot; style=&quot;margin-top:10px;&quot;&gt;
              &lt;li&gt;只统计成功入账订单，失败、取消、超时、未支付订单不计入成功次数。&lt;/li&gt;
              &lt;li&gt;规则命中后，不直接修改通道管理中的原始最小金额，而是在返回给当前用户时动态覆盖。&lt;/li&gt;
              &lt;li&gt;如果多个步骤都命中，应以前后端约定的优先级执行，建议按最高限制结果生效。&lt;/li&gt;
              &lt;li&gt;用户端展示限额和后端下单校验必须使用同一套计算逻辑。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;五、用户端表现&lt;/h3&gt;
            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;未命中规则：展示通道原始限额，例如 10-1000000。&lt;/li&gt;
              &lt;li&gt;命中第一步：原本最低金额小于 100 的通道，用户端最低限额展示为 100。&lt;/li&gt;
              &lt;li&gt;命中第二步：原本最低金额小于 200 的通道，用户端最低限额展示为 200。&lt;/li&gt;
              &lt;li&gt;命中第三步：手续费不满足条件的通道不展示或不可用；满足条件的通道按规则调整最低金额。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;六、验收重点&lt;/h3&gt;
            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;开关停用时，用户端所有用户都按通道原始金额展示。&lt;/li&gt;
              &lt;li&gt;不同用户历史充值不同，看到的最低金额可能不同，不能串用户数据。&lt;/li&gt;
              &lt;li&gt;充值成功后，下一次进入充值页应使用最新成功次数重新计算。&lt;/li&gt;
              &lt;li&gt;绕过前端直接提交低于限制金额的订单，后端必须拦截。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;requirement-doc payment-doc&quot; data-payment-doc=&quot;group&quot;&gt;
        &lt;header class=&quot;requirement-doc-header&quot;&gt;
          &lt;div class=&quot;requirement-doc-kicker&quot;&gt;超详细需求文档&lt;/div&gt;
          &lt;h2&gt;充值管理 / 通道组管理&lt;/h2&gt;
          &lt;div class=&quot;requirement-doc-subtitle&quot;&gt;把多个充值通道组合成一组，供标签关联和用户端展示。&lt;/div&gt;
        &lt;/header&gt;
        &lt;div class=&quot;requirement-doc-body&quot;&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;一、功能定位&lt;/h3&gt;
            &lt;p&gt;通道组管理用于把多个充值通道组合成一组，便于标签管理按组关联，也便于用户端按组展示充值入口。它不是三方支付渠道，也不是单个订单入口；它是对多个通道的分组配置。&lt;/p&gt;
            &lt;div class=&quot;req-deep-card&quot;&gt;&lt;strong&gt;一句话理解：&lt;/strong&gt;通道组 = 一组充值通道的集合，例如「支付宝中额」「钱包」「数字人民币」。&lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;二、完整流程图&lt;/h3&gt;
            &lt;div class=&quot;req-flow&quot;&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;1&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;后台新增通道组&lt;/span&gt;配置通道组名称、支付方式、支付通道、区间金额、快捷金额、排序、图标等。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;2&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;绑定组内通道&lt;/span&gt;支付通道字段选择【通道管理】中已有的通道数据，形成一个通道集合。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;3&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;标签关联通道组&lt;/span&gt;在【标签管理】中选择通道分类组，把该组挂到某个用户端标签下面。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;4&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;用户进入充值页&lt;/span&gt;后端根据标签找到关联通道组，再取出组内可用通道。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;5&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;后端过滤可用数据&lt;/span&gt;按通道状态、支付渠道状态、展示配置、金额规则、小额限制、押金额度过滤。&lt;/div&gt;
              &lt;div class=&quot;req-flow-step&quot; data-step=&quot;6&quot;&gt;&lt;span class=&quot;req-flow-title&quot;&gt;用户端展示&lt;/span&gt;展示该通道组或组内通道；点击后按实际可用通道创建充值订单。&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;三、列表字段说明&lt;/h3&gt;
            &lt;div class=&quot;req-field-list&quot;&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;通道组名称&lt;/span&gt;&lt;span class=&quot;req-pill front&quot;&gt;展示字段&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;后台识别和用户端分组展示名称。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;通道组ID&lt;/span&gt;&lt;span class=&quot;req-pill back&quot;&gt;系统字段&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;来源&lt;/b&gt;&lt;span&gt;系统生成或后端维护，用于接口关联。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;支付方式&lt;/span&gt;&lt;span class=&quot;req-pill front&quot;&gt;分类字段&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;标识该组属于支付宝、钱包、数字人民币等哪类支付方式。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;通道数&lt;/span&gt;&lt;span class=&quot;req-pill back&quot;&gt;统计字段&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;来源&lt;/b&gt;&lt;span&gt;根据组内绑定的支付通道数量自动统计。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;图标&lt;/span&gt;&lt;span class=&quot;req-pill front&quot;&gt;展示字段&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;用户端通道组或卡片图标；列表展示缩略图。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;四、新增 / 编辑字段说明&lt;/h3&gt;
            &lt;div class=&quot;req-field-list&quot;&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;通道组名称&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;通道组展示和后台识别名称。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;校验&lt;/b&gt;&lt;span&gt;不能为空；同一站点下建议不允许重名。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;req-field-card&quot;&gt;&lt;div class=&quot;req-field-head&quot;&gt;&lt;span class=&quot;req-field-name&quot;&gt;支付方式&lt;/span&gt;&lt;span class=&quot;req-pill required&quot;&gt;必填&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-field-body&quot;&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;取值&lt;/b&gt;&lt;span&gt;银行卡、支付宝、微信、USDT、电子钱包等。&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;req-data-line&quot;&gt;&lt;b&gt;用途&lt;/b&gt;&lt;span&gt;用于筛选可绑定通道和用户端展示分类。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

            &lt;/div&gt;

            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;标签管理选择通道分类组后，用户端点击该标签时，需要加载该通道组下可用通道。&lt;/li&gt;
              &lt;li&gt;通道组状态或组内通道不可用时，用户端不应展示不可下单入口。&lt;/li&gt;
              &lt;li&gt;如果通道组配置快捷金额，则用户端展示快捷金额；未配置则不展示。&lt;/li&gt;
              &lt;li&gt;通道组图标用于用户端展示，未上传不允许保存。&lt;/li&gt;
              &lt;li&gt;删除通道组需要二次确认；删除后标签中关联的该通道组应失效，但不删除组内通道。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

          &lt;section class=&quot;req-section&quot;&gt;
            &lt;h3&gt;七、验收重点&lt;/h3&gt;
            &lt;ul class=&quot;req-list&quot;&gt;
              &lt;li&gt;新增 / 编辑通道组时，必填字段校验正确。&lt;/li&gt;
              &lt;li&gt;快捷金额为空可以保存，用户端不展示快捷金额按钮。&lt;/li&gt;
              &lt;li&gt;选择支付通道后，列表通道数应正确统计。&lt;/li&gt;
              &lt;li&gt;标签关联通道组后，用户端对应标签下能展示组内可用通道。&lt;/li&gt;
              &lt;li&gt;删除通道组后二次确认生效，且不误删通道管理中的通道数据。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/section&gt;

        rows[rowIndex].realMin = &#x27;&#x27;;

    function handleH5ChestClick(chest) {
      if (!chest) return;
      const state = chest.dataset.state;
      const bonus = chest.dataset.bonus || &#x27;XX&#x27;;
      const multiple = chest.dataset.multiple || &#x27;X&#x27;;

      if (state === &#x27;locked&#x27;) {
        showToast(`打开后获得${bonus}彩金，需${multiple}倍流水可提现`);
        return;
      }

      if (state === &#x27;unlocked&#x27;) {
        chest.dataset.state = &#x27;opened&#x27;;
        chest.classList.remove(&#x27;is-unlocked&#x27;);
        chest.classList.add(&#x27;is-opened&#x27;);
        chest.setAttribute(&#x27;aria-label&#x27;, &#x27;宝箱已开启，点击查看奖励提示&#x27;);
        chest.setAttribute(&#x27;aria-disabled&#x27;, &#x27;false&#x27;);
        const tag = chest.querySelector(&#x27;.task-h5-chest-tag&#x27;);
        if (tag) tag.textContent = &#x27;已开启&#x27;;
        showToast(`已获得${bonus}彩金，需${multiple}倍流水可提现`);
        return;
      }

      if (state === &#x27;opened&#x27;) {
        showToast(`已获得${bonus}彩金，需${multiple}倍流水可提现`);
      }
    }

    window.handleH5ChestClick = handleH5ChestClick;

    function handleH5TaskCategoryClick(button) {
      if (!button) return;
      const shell = button.closest(&#x27;.task-h5-category-shell&#x27;);
      if (!shell) return;
      const category = button.dataset.taskCategory || &#x27;all&#x27;;

      shell.querySelectorAll(&#x27;.task-h5-category&#x27;).forEach(item =&gt; {
        const active = item === button;
        item.classList.toggle(&#x27;active&#x27;, active);
        item.setAttribute(&#x27;aria-selected&#x27;, active ? &#x27;true&#x27; : &#x27;false&#x27;);
      });

      let visibleCount = 0;
      shell.querySelectorAll(&#x27;[data-task-group]&#x27;).forEach(group =&gt; {
        const visible = category === &#x27;all&#x27; || group.dataset.taskGroup === category;
        group.hidden = !visible;
        if (visible) visibleCount += 1;
      });

      const empty = shell.querySelector(&#x27;[data-task-empty]&#x27;);
      if (empty) empty.classList.toggle(&#x27;active&#x27;, visibleCount === 0);
      button.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;nearest&#x27;, inline: &#x27;center&#x27; });
    }

    function renderOperationPage() {
      const current = operationMenus.find(menu =&gt; menu.key === currentOperationChild) || operationMenus.find(menu =&gt; menu.key === &#x27;task&#x27;);
      const page = document.getElementById(&#x27;operationPage&#x27;);
      if (!page) return;

      if (currentOperationChild === &#x27;task&#x27;) {
        page.innerHTML = renderTaskConfigPage();
      } else {
        page.innerHTML = renderOperationPlaceholderPage(current);
      }

      renderOperationDoc(current);
    }

    function getRows() {
      return currentModule === &#x27;game&#x27; ? gameRows : venueRows;
    }

    function getModuleWord() {
      return currentModule === &#x27;game&#x27; ? &#x27;游戏&#x27; : &#x27;场馆&#x27;;
    }

    function getModuleMenuName() {
      return currentModule === &#x27;game&#x27; ? &#x27;站点游戏管理&#x27; : &#x27;站点场馆管理&#x27;;
    }


    function syncSidebarMenu() {
      document.querySelectorAll(&#x27;.nav-group&#x27;).forEach(group =&gt; {
        const isPaymentGroup = group.classList.contains(&#x27;payment-nav-group&#x27;);
        const isOperationGroup = group.classList.contains(&#x27;operation-nav-group&#x27;);
        const shouldOpen = (sidebarOpenGroup === &#x27;payment&#x27; &amp;&amp; isPaymentGroup) || (sidebarOpenGroup === &#x27;operation&#x27; &amp;&amp; isOperationGroup);
        group.classList.toggle(&#x27;is-open&#x27;, shouldOpen);
      });

      document.querySelectorAll(&#x27;.nav-item.parent[data-module]&#x27;).forEach(parent =&gt; {
        const groupKey = parent.dataset.module;
        const isOpen = sidebarOpenGroup === groupKey;
        parent.setAttribute(&#x27;aria-expanded&#x27;, isOpen ? &#x27;true&#x27; : &#x27;false&#x27;);
      });
    }

    function toggleSidebarGroup(groupKey, defaultChild) {
      if (sidebarOpenGroup === groupKey) {
        sidebarOpenGroup = &#x27;&#x27;;
        syncSidebarMenu();
        return;
      }

      sidebarOpenGroup = groupKey;

      if (groupKey === &#x27;payment&#x27;) {
        switchPaymentChild(defaultChild || &#x27;recharge&#x27;);
        return;
      }

      if (groupKey === &#x27;operation&#x27;) {
        switchOperationChild(defaultChild || &#x27;task&#x27;);
        return;
      }

      syncSidebarMenu();
    }

    function updateModuleUI() {
      const layout = document.getElementById(&#x27;appLayout&#x27;);
      if (!layout) return;

      const isPayment = currentPrimary === &#x27;payment&#x27;;
      const isOperation = currentPrimary === &#x27;operation&#x27;;
      layout.classList.toggle(&#x27;payment-mode&#x27;, isPayment);
      layout.classList.toggle(&#x27;operation-mode&#x27;, isOperation);
      layout.classList.toggle(&#x27;game-mode&#x27;, !isPayment &amp;&amp; !isOperation &amp;&amp; currentModule === &#x27;game&#x27;);

      document.querySelectorAll(&#x27;.nav-item[data-module]&#x27;).forEach(item =&gt; {
        item.classList.toggle(&#x27;active&#x27;, !isPayment &amp;&amp; !isOperation &amp;&amp; item.dataset.module === currentModule);
      });

      const paymentParent = document.querySelector(&#x27;.nav-item[data-module=&quot;payment&quot;]&#x27;);
      if (paymentParent) paymentParent.classList.toggle(&#x27;active&#x27;, isPayment);
      const operationParent = document.querySelector(&#x27;.nav-item[data-module=&quot;operation&quot;]&#x27;);
      if (operationParent) operationParent.classList.toggle(&#x27;active&#x27;, isOperation);
      document.querySelectorAll(&#x27;.nav-child[data-pay-child]&#x27;).forEach(btn =&gt; {
        btn.classList.toggle(&#x27;active&#x27;, isPayment &amp;&amp; btn.dataset.payChild === currentPayChild);
      });
      document.querySelectorAll(&#x27;.nav-child[data-op-child]&#x27;).forEach(btn =&gt; {
        btn.classList.toggle(&#x27;active&#x27;, isOperation &amp;&amp; btn.dataset.opChild === currentOperationChild);
      });
      syncSidebarMenu();

      const listPage = document.getElementById(&#x27;listPage&#x27;);
      const paymentPage = document.getElementById(&#x27;paymentPage&#x27;);
      const operationPage = document.getElementById(&#x27;operationPage&#x27;);
      const formPage = document.getElementById(&#x27;formPage&#x27;);
      if (listPage) listPage.classList.toggle(&#x27;hidden&#x27;, isPayment || isOperation);
      if (paymentPage) paymentPage.style.display = isPayment ? &#x27;block&#x27; : &#x27;none&#x27;;
      if (operationPage) operationPage.style.display = isOperation ? &#x27;block&#x27; : &#x27;none&#x27;;
      if ((isPayment || isOperation) &amp;&amp; formPage) formPage.classList.add(&#x27;hidden&#x27;);

        return;

      if (isPayment) {

        const breadcrumb = document.querySelector(&#x27;.breadcrumb&#x27;);
