          breadcrumb.innerHTML = &#x27;&lt;span&gt;站点管理后台&lt;/span&gt;&lt;span&gt;/&lt;/span&gt;&lt;span&gt;支付管理&lt;/span&gt;&lt;span&gt;/&lt;/span&gt;&lt;span class=&quot;crumb-current&quot;&gt;充值管理&lt;/span&gt;&#x27;;
        }
        const simple = document.querySelector(&#x27;.payment-simple-breadcrumb-inner&#x27;);
        if (simple) {
          simple.innerHTML = &#x27;&lt;span&gt;站点管理后台&lt;/span&gt;&lt;span class=&quot;simple-separator&quot;&gt;/&lt;/span&gt;&lt;span&gt;支付管理&lt;/span&gt;&lt;span class=&quot;simple-separator&quot;&gt;/&lt;/span&gt;&lt;span class=&quot;simple-current&quot;&gt;充值管理&lt;/span&gt;&#x27;;
        }
        const activeTab = document.querySelector(&#x27;.tab.active&#x27;);
        if (activeTab) activeTab.textContent = &#x27;充值管理 ×&#x27;;
        renderPayTable();
        return;

      if (formNameLabel) formNameLabel.textContent = `${word}名称`;

      const tagSectionTitle = document.querySelector(&#x27;.tag-section .section-title&#x27;);
      if (tagSectionTitle) tagSectionTitle.textContent = `${word}标签配置`;

      const tagIndex = document.querySelector(&#x27;.tag-section .section-index&#x27;);
      if (tagIndex) tagIndex.textContent = currentModule === &#x27;game&#x27; ? &#x27;02&#x27; : &#x27;03&#x27;;

      applyColumnVisibility();
    }

    function switchModule(module) {
      currentPrimary = &#x27;site&#x27;;
      currentModule = module;
      sidebarOpenGroup = &#x27;&#x27;;
      closePanels();
      closeTimeRangePanel();
      closePayPanels();
      closePayStatus();
      if (!document.getElementById(&#x27;formPage&#x27;).classList.contains(&#x27;hidden&#x27;)) closeFormPage();

      document.getElementById(&#x27;keyword&#x27;).value = &#x27;&#x27;;
      window.activeStatusFilter = &#x27;&#x27;;
      document.getElementById(&#x27;startDate&#x27;).value = &#x27;&#x27;;
      document.getElementById(&#x27;endDate&#x27;).value = &#x27;&#x27;;
      syncTimeRangeDisplay();
      selectedVenueIds.clear();
      currentPage = 1;

      document.querySelectorAll(&#x27;.chip&#x27;).forEach(btn =&gt; btn.classList.toggle(&#x27;active&#x27;, btn.dataset.status === &#x27;&#x27;));
      updateModuleUI();
      renderTable();
      showToast(`已切换到${getModuleMenuName()}`);
    }

    function switchPaymentChild(type) {
      currentPrimary = &#x27;payment&#x27;;
      sidebarOpenGroup = &#x27;payment&#x27;;
      currentPayChild = &#x27;recharge&#x27;;
      closePanels();
      closeTimeRangePanel();
      closePayPanels();
      closePayStatus();
      if (!document.getElementById(&#x27;formPage&#x27;).classList.contains(&#x27;hidden&#x27;)) closeFormPage();

      if (type !== &#x27;recharge&#x27;) {
        updateModuleUI();
        showToast(`${type === &#x27;withdraw&#x27; ? &#x27;提现管理&#x27; : &#x27;取款帐号管理&#x27;}后续再展开，当前先做充值管理 / 标签`);
        return;
      }

      updateModuleUI();
      showToast(&#x27;当前为充值管理 / 标签&#x27;);
    }

    function switchOperationChild(type) {
      currentPrimary = &#x27;operation&#x27;;
      sidebarOpenGroup = &#x27;operation&#x27;;
      currentOperationChild = type || &#x27;task&#x27;;
      closePanels();
      closeTimeRangePanel();
      closePayPanels();
      closePayStatus();
      closePayEdit();
      if (!document.getElementById(&#x27;formPage&#x27;).classList.contains(&#x27;hidden&#x27;)) closeFormPage();
      updateModuleUI();
      showToast(`已切换到${getOperationMenuName()}`);
    }

    function getFilteredRows() {
      const keyword = document.getElementById(&#x27;keyword&#x27;).value.trim().toLowerCase();
      const status = document.getElementById(&#x27;statusFilter&#x27;) ? document.getElementById(&#x27;statusFilter&#x27;).value : (window.activeStatusFilter || &#x27;&#x27;);
      const start = document.getElementById(&#x27;startDate&#x27;).value;
      const end = document.getElementById(&#x27;endDate&#x27;).value;
      return getRows()
        .map((row, index) =&gt; ({ ...row, index }))
        .filter(row =&gt; !keyword || row.name.toLowerCase().includes(keyword) || row.category.toLowerCase().includes(keyword))
        .filter(row =&gt; !status || row.status === status)
        .filter(row =&gt; {
          const day = row.time.slice(0, 10);
          if (start &amp;&amp; !end) return day === start;
          if (!start &amp;&amp; end) return day === end;
          return (!start || day &gt;= start) &amp;&amp; (!end || day &lt;= end);
        });
    }

    function formatDateLabel(value) {
      if (!value) return &#x27;&#x27;;
      const parts = value.split(&#x27;-&#x27;);
      return parts.length === 3 ? `${parts[0]}/${parts[1]}/${parts[2]}` : value;
    }

    function syncTimeRangeDisplay() {
      const start = document.getElementById(&#x27;startDate&#x27;).value;
      const end = document.getElementById(&#x27;endDate&#x27;).value;
      const text = document.getElementById(&#x27;timeRangeText&#x27;);
      if (!text) return;

      if (start &amp;&amp; end) {
        text.textContent = start === end ? formatDateLabel(start) : `${formatDateLabel(start)} 至 ${formatDateLabel(end)}`;
        text.classList.add(&#x27;active&#x27;);
      } else if (start || end) {
        text.textContent = formatDateLabel(start || end);
        text.classList.add(&#x27;active&#x27;);
      } else {
        text.textContent = &#x27;请选择时间&#x27;;
        text.classList.remove(&#x27;active&#x27;);
      }
    }

    function closeTimeRangePanel() {
      const field = document.getElementById(&#x27;timeRangeField&#x27;);
      if (field) field.classList.remove(&#x27;open&#x27;);
    }

    function toggleTimeRangePanel(event) {
      event.stopPropagation();
      const field = document.getElementById(&#x27;timeRangeField&#x27;);
      if (!field) return;
      const willOpen = !field.classList.contains(&#x27;open&#x27;);
      closePanels();
      closeTimeRangePanel();
      if (willOpen) field.classList.add(&#x27;open&#x27;);
    }

    function toDateInputValue(date) {
      const pad = n =&gt; String(n).padStart(2, &#x27;0&#x27;);
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function setQuickRange(type) {
      const today = new Date();
      const startInput = document.getElementById(&#x27;startDate&#x27;);
      const endInput = document.getElementById(&#x27;endDate&#x27;);
      let start = new Date(today);
      let end = new Date(today);

      if (type === &#x27;yesterday&#x27;) {
        start.setDate(today.getDate() - 1);
        end.setDate(today.getDate() - 1);
      }
      if (type === &#x27;7days&#x27;) {
        start.setDate(today.getDate() - 6);
      }
      if (type === &#x27;30days&#x27;) {
        start.setDate(today.getDate() - 29);
      }

      startInput.value = toDateInputValue(start);
      endInput.value = toDateInputValue(end);
      syncTimeRangeDisplay();
      renderTable();
      closeTimeRangePanel();
    }

    function clearTimeRange() {
      document.getElementById(&#x27;startDate&#x27;).value = &#x27;&#x27;;
      document.getElementById(&#x27;endDate&#x27;).value = &#x27;&#x27;;
      syncTimeRangeDisplay();
      renderTable();
      closeTimeRangePanel();
    }

    function confirmTimeRange() {
      syncTimeRangeDisplay();
      renderTable();
      closeTimeRangePanel();
    }

    function applyDensity() {
      const tableCard = document.querySelector(&#x27;.table-card&#x27;);
      if (!tableCard) return;
      tableCard.classList.remove(&#x27;density-default&#x27;, &#x27;density-medium&#x27;, &#x27;density-compact&#x27;);
      tableCard.classList.add(`density-${currentDensity}`);
      document.querySelectorAll(&#x27;.density-option&#x27;).forEach(btn =&gt; btn.classList.toggle(&#x27;active&#x27;, btn.dataset.density === currentDensity));
    }

    function setDensity(type) {
      currentDensity = type;
      applyDensity();
      closePanels();
      showToast(`已切换为${type === &#x27;default&#x27; ? &#x27;默认&#x27; : type === &#x27;medium&#x27; ? &#x27;中等&#x27; : &#x27;紧凑&#x27;}密度`);
    }

    function closePanels() {
      const densityPanel = document.getElementById(&#x27;densityPanel&#x27;);
      const columnsPanel = document.getElementById(&#x27;columnsPanel&#x27;);
      const densityBtn = document.getElementById(&#x27;densityBtn&#x27;);
      const columnsBtn = document.getElementById(&#x27;columnsBtn&#x27;);
      if (densityPanel) densityPanel.classList.remove(&#x27;show&#x27;);
      if (columnsPanel) columnsPanel.classList.remove(&#x27;show&#x27;);
      if (densityBtn) densityBtn.classList.remove(&#x27;active&#x27;);
      if (columnsBtn) columnsBtn.classList.remove(&#x27;active&#x27;);
    }

    function toggleDensityPanel(event) {
      event.stopPropagation();
      const panel = document.getElementById(&#x27;densityPanel&#x27;);
      const btn = document.getElementById(&#x27;densityBtn&#x27;);
      const willShow = !panel.classList.contains(&#x27;show&#x27;);
      closePanels();
      if (willShow) {
        panel.classList.add(&#x27;show&#x27;);
        btn.classList.add(&#x27;active&#x27;);
      }
    }

    function toggleColumnsPanel(event) {
      event.stopPropagation();
      const panel = document.getElementById(&#x27;columnsPanel&#x27;);
      const btn = document.getElementById(&#x27;columnsBtn&#x27;);
      const willShow = !panel.classList.contains(&#x27;show&#x27;);
      closePanels();
      if (willShow) {
        panel.classList.add(&#x27;show&#x27;);
        btn.classList.add(&#x27;active&#x27;);
      }
    }

    function applyColumnVisibility() {
      document.querySelectorAll(&#x27;[data-col]&#x27;).forEach(el =&gt; {
        const col = el.dataset.col;
        let visible = true;
        if (col === &#x27;sequence&#x27; || col === &#x27;selection&#x27;) visible = !!extraColumns[col];
        else visible = !!visibleColumns[col];
        el.style.display = visible ? &#x27;&#x27; : &#x27;none&#x27;;
      });
      document.querySelectorAll(&#x27;#columnsPanel input[type=&quot;checkbox&quot;][data-col]&#x27;).forEach(input =&gt; {
        input.checked = !!visibleColumns[input.dataset.col];
      });
      const sequenceToggle = document.getElementById(&#x27;sequenceToggle&#x27;);
      const selectionToggle = document.getElementById(&#x27;selectionToggle&#x27;);
      if (sequenceToggle) sequenceToggle.checked = !!extraColumns.sequence;
      if (selectionToggle) selectionToggle.checked = !!extraColumns.selection;
    }

    function toggleColumn(col, checked) {
      visibleColumns[col] = checked;
      applyColumnVisibility();
    }

    function toggleExtraColumn(col, checked) {
      extraColumns[col] = checked;
      applyColumnVisibility();
    }

    function resetColumns() {
      Object.keys(visibleColumns).forEach(key =&gt; visibleColumns[key] = true);
      Object.keys(extraColumns).forEach(key =&gt; extraColumns[key] = true);
      applyColumnVisibility();
      renderTable();
      showToast(&#x27;列设置已重置&#x27;);
    }

    function toggleSelectAll(checked) {
      const rows = getFilteredRows();
      rows.forEach((row, orderIndex) =&gt; {
        if (checked) selectedVenueIds.add(row.id);
        else selectedVenueIds.delete(row.id);
      });
      renderTable();
    }

    function toggleRowSelect(id, checked) {
      if (checked) selectedVenueIds.add(id);
      else selectedVenueIds.delete(id);
      updateSelectAllState();
    }

    function updateSelectAllState() {
      const selectAll = document.getElementById(&#x27;selectAllCheckbox&#x27;);
      if (!selectAll) return;
      const rows = getFilteredRows();
      if (!rows.length) {
        selectAll.checked = false;
        selectAll.indeterminate = false;
        return;
      }
      const selectedCount = rows.filter(row =&gt; selectedVenueIds.has(row.id)).length;
      selectAll.checked = selectedCount &gt; 0 &amp;&amp; selectedCount === rows.length;
      selectAll.indeterminate = selectedCount &gt; 0 &amp;&amp; selectedCount &lt; rows.length;
    }

    function refreshTable() {
      renderTable();
      showToast(&#x27;刷新成功&#x27;);
    }

    function renderTable() {
      const rows = getFilteredRows();
      const body = document.getElementById(&#x27;tableBody&#x27;);
      body.innerHTML = &#x27;&#x27;;

      rows.forEach((row, orderIndex) =&gt; {
        const status = row.status === &#x27;enabled&#x27;
          ? &#x27;&lt;span class=&quot;tag enabled&quot;&gt;启用&lt;/span&gt;&#x27;
          : &#x27;&lt;span class=&quot;tag disabled&quot;&gt;禁用&lt;/span&gt;&#x27;;
        const smallImageHtml = row.smallConfigured === false
          ? &#x27;&lt;span class=&quot;image-empty&quot;&gt;-&lt;/span&gt;&#x27;
          : `&lt;img class=&quot;venue-small-img&quot; src=&quot;${imageAssets.small}&quot; alt=&quot;${getModuleWord()}小图&quot;&gt;`;
        const bigImageHtml = row.bigConfigured === false
          ? &#x27;&lt;span class=&quot;image-empty&quot;&gt;-&lt;/span&gt;&#x27;
          : `&lt;img class=&quot;venue-big-img&quot; src=&quot;${imageAssets.large}&quot; alt=&quot;${getModuleWord()}大图&quot;&gt;`;
        const logoImageHtml = row.logoData
          ? `&lt;span class=&quot;logo-frame&quot;&gt;&lt;img class=&quot;venue-logo-img&quot; src=&quot;${row.logoData}&quot; alt=&quot;${getModuleWord()}LOGO&quot;&gt;&lt;/span&gt;`
          : &#x27;&lt;span class=&quot;image-empty&quot;&gt;-&lt;/span&gt;&#x27;;
        const tagImageHtml = row.tagConfigured === false || !row.tagText || !row.tagTemplate
          ? &#x27;&lt;span class=&quot;image-empty&quot;&gt;-&lt;/span&gt;&#x27;
          : `&lt;span class=&quot;venue-tag-preview ${row.tagTemplate}&quot;&gt;${row.tagText}&lt;/span&gt;`;
        const isChecked = selectedVenueIds.has(row.id) ? &#x27;checked&#x27; : &#x27;&#x27;;
        const sequenceNumber = orderIndex + 1;

        body.insertAdjacentHTML(&#x27;beforeend&#x27;, `
          &lt;tr&gt;
            &lt;td class=&quot;select-col table-center&quot; data-col=&quot;selection&quot;&gt;&lt;input class=&quot;table-check&quot; type=&quot;checkbox&quot; ${isChecked} onchange=&quot;toggleRowSelect(${row.id}, this.checked)&quot;&gt;&lt;/td&gt;
            &lt;td class=&quot;seq-col table-center&quot; data-col=&quot;sequence&quot;&gt;${sequenceNumber}&lt;/td&gt;
            &lt;td class=&quot;name-col&quot; data-col=&quot;name&quot; title=&quot;${row.name}&quot;&gt;${row.name}&lt;/td&gt;
            &lt;td class=&quot;small-img-col&quot; data-col=&quot;small&quot;&gt;${smallImageHtml}&lt;/td&gt;
            &lt;td class=&quot;big-img-col&quot; data-col=&quot;big&quot;&gt;${bigImageHtml}&lt;/td&gt;
            &lt;td class=&quot;logo-col&quot; data-col=&quot;logo&quot;&gt;${logoImageHtml}&lt;/td&gt;
            &lt;td class=&quot;tag-col&quot; data-col=&quot;tag&quot;&gt;${tagImageHtml}&lt;/td&gt;
            &lt;td class=&quot;category-col&quot; data-col=&quot;category&quot;&gt;${row.category}&lt;/td&gt;
            &lt;td class=&quot;status-col&quot; data-col=&quot;status&quot;&gt;${status}&lt;/td&gt;
            &lt;td class=&quot;operator-col&quot; data-col=&quot;operator&quot;&gt;${row.operator}&lt;/td&gt;
            &lt;td class=&quot;time-col&quot; data-col=&quot;time&quot;&gt;${row.time}&lt;/td&gt;
            &lt;td class=&quot;remark-col&quot; data-col=&quot;remark&quot; title=&quot;${row.remark}&quot;&gt;${row.remark}&lt;/td&gt;
            &lt;td class=&quot;action-col&quot; data-col=&quot;action&quot;&gt;
              &lt;div class=&quot;action-cell&quot;&gt;
                &lt;button class=&quot;action-link edit&quot; onclick=&quot;openEditPage(${row.index})&quot;&gt;编辑&lt;/button&gt;
                &lt;button class=&quot;action-link neutral&quot; onclick=&quot;showToast(&#x27;排序入口已预留&#x27;)&quot;&gt;排序&lt;/button&gt;
                &lt;button class=&quot;action-link neutral&quot; onclick=&quot;openActionModal(&#x27;维护&#x27;, ${row.index})&quot;&gt;维护&lt;/button&gt;
                &lt;button class=&quot;action-link danger&quot; onclick=&quot;openActionModal(&#x27;关闭&#x27;, ${row.index})&quot;&gt;关闭&lt;/button&gt;
              &lt;/div&gt;
            &lt;/td&gt;
          &lt;/tr&gt;
        `);
      });

      document.getElementById(&#x27;totalText&#x27;).textContent = `共 ${totalDesignCount} 条数据`;
      updateCounts();
      applyColumnVisibility();
      updateSelectAllState();
      applyDensity();
      renderPager();
    }

    function renderPager() {
      document.querySelectorAll(&#x27;.pager-actions .page-btn&#x27;).forEach(btn =&gt; {
        const page = Number(btn.textContent);
        btn.classList.toggle(&#x27;active&#x27;, page === currentPage);
      });
    }

    function setPage(page) {
      currentPage = Math.min(Math.max(Number(page) || 1, 1), 3);
      renderPager();
      showToast(`已切换到第 ${currentPage} 页`);
    }

    function nextPage() {
      setPage(currentPage &gt;= 3 ? 3 : currentPage + 1);
    }

    function changePageSize() {
      currentPage = 1;
      renderPager();
      const size = document.getElementById(&#x27;pageSizeSelect&#x27;).value;
      showToast(`已切换为 ${size} 条/页`);
    }

    function handleJumpKey(event) {
      if (event.key !== &#x27;Enter&#x27;) return;
      const value = Number(event.target.value);
      if (!value) return;
      setPage(value);
      event.target.value = &#x27;&#x27;;
    }

    function updateCounts() {
      document.getElementById(&#x27;countAll&#x27;).textContent = getRows().length;
      document.getElementById(&#x27;countEnabled&#x27;).textContent = getRows().filter(v =&gt; v.status === &#x27;enabled&#x27;).length;
      document.getElementById(&#x27;countDisabled&#x27;).textContent = getRows().filter(v =&gt; v.status === &#x27;disabled&#x27;).length;
    }

    function setStatus(status) {
      window.activeStatusFilter = status;
      if (document.getElementById(&#x27;statusFilter&#x27;)) document.getElementById(&#x27;statusFilter&#x27;).value = status;
      document.querySelectorAll(&#x27;.chip&#x27;).forEach(btn =&gt; btn.classList.toggle(&#x27;active&#x27;, btn.dataset.status === status));
      renderTable();
    }

    function resetFilters() {
      document.getElementById(&#x27;keyword&#x27;).value = &#x27;&#x27;;
      window.activeStatusFilter = &#x27;&#x27;;
      if (document.getElementById(&#x27;statusFilter&#x27;)) document.getElementById(&#x27;statusFilter&#x27;).value = &#x27;&#x27;;
      document.getElementById(&#x27;startDate&#x27;).value = &#x27;&#x27;;
      document.getElementById(&#x27;endDate&#x27;).value = &#x27;&#x27;;
      syncTimeRangeDisplay();
      document.querySelectorAll(&#x27;.chip&#x27;).forEach(btn =&gt; btn.classList.toggle(&#x27;active&#x27;, btn.dataset.status === &#x27;&#x27;));
      renderTable();
      showToast(&#x27;筛选已重置&#x27;);
    }

    function openEditPage(index) {
      editingIndex = index;
      const row = getRows()[index];
      tempLogoData = row.logoData || &#x27;&#x27;;
      document.getElementById(&#x27;listPage&#x27;).classList.add(&#x27;hidden&#x27;);
      document.getElementById(&#x27;formPage&#x27;).classList.remove(&#x27;hidden&#x27;);
      document.getElementById(&#x27;formName&#x27;).value = row.name;
      document.getElementById(&#x27;formCategory&#x27;).value = row.category;
      document.getElementById(&#x27;formRemark&#x27;).value = row.remark === &#x27;-&#x27; ? &#x27;&#x27; : row.remark;
      selectedTagTemplate = &#x27;&#x27;;
      document.getElementById(&#x27;tagText&#x27;).value = row.tagText || &#x27;&#x27;;
      renderLogoUploadState();
      if (document.getElementById(&#x27;frontLogo&#x27;) &amp;&amp; tempLogoData) document.getElementById(&#x27;frontLogo&#x27;).src = tempLogoData;
      if (document.getElementById(&#x27;frontName&#x27;)) document.getElementById(&#x27;frontName&#x27;).textContent = row.name;
      updateTemplateSelection();
      updateTagPreview();
      window.scrollTo({ top: 0, behavior: &#x27;smooth&#x27; });
    }

    function closeFormPage() {
      document.getElementById(&#x27;formPage&#x27;).classList.add(&#x27;hidden&#x27;);
      document.getElementById(&#x27;listPage&#x27;).classList.remove(&#x27;hidden&#x27;);
      editingIndex = null;
      tempLogoData = &#x27;&#x27;;
    }

    function handleLogoUpload(event) {
      const file = event.target.files[0];
      const error = document.getElementById(&#x27;uploadError&#x27;);
      error.style.display = &#x27;none&#x27;;
      if (!file) return;

      const validTypes = [&#x27;image/webp&#x27;, &#x27;image/jpeg&#x27;, &#x27;image/png&#x27;];
      const validExt = /\.(webp|jpg|jpeg|png)$/i.test(file.name);
      if (!validTypes.includes(file.type) &amp;&amp; !validExt) {
        error.textContent = &#x27;仅支持 webp、jpg、png 格式&#x27;;
        error.style.display = &#x27;block&#x27;;
        event.target.value = &#x27;&#x27;;
        return;
      }
      if (file.size &gt; 100 * 1024) {
        error.textContent = &#x27;文件大小不能超过 100KB&#x27;;
        error.style.display = &#x27;block&#x27;;
        event.target.value = &#x27;&#x27;;
        return;
      }

      const reader = new FileReader();
      reader.onload = e =&gt; {
        tempLogoData = e.target.result;
        renderLogoUploadState();
        event.target.value = &#x27;&#x27;;
        showToast(&#x27;LOGO 已上传&#x27;);
      };
      reader.readAsDataURL(file);
    }

    function triggerLogoUpload() {
      const input = document.getElementById(&#x27;logoFile&#x27;);
      if (input) input.click();
    }

    function renderLogoUploadState() {
      const preview = document.getElementById(&#x27;uploadPreview&#x27;);
      if (!preview) return;

      if (tempLogoData) {
        preview.className = &#x27;upload-preview has-image&#x27;;
        preview.removeAttribute(&#x27;for&#x27;);
        preview.title = &#x27;已上传LOGO&#x27;;
        preview.innerHTML = `
          &lt;img class=&quot;upload-image&quot; src=&quot;${tempLogoData}&quot; alt=&quot;${getModuleWord()}LOGO&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;preview-eye-btn&quot; title=&quot;预览图片&quot; onclick=&quot;previewLogoImage(event)&quot; aria-label=&quot;预览图片&quot;&gt;
            &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;
              &lt;path d=&quot;M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z&quot;&gt;&lt;/path&gt;
              &lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;2.6&quot;&gt;&lt;/circle&gt;
            &lt;/svg&gt;
          &lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;logo-clear-btn&quot; title=&quot;清空图片&quot; onclick=&quot;deleteLogo(event)&quot;&gt;×&lt;/button&gt;
        `;
      } else {
        preview.className = &#x27;upload-preview&#x27;;
        preview.setAttribute(&#x27;for&#x27;, &#x27;logoFile&#x27;);
        preview.title = &#x27;点击上传LOGO&#x27;;
        preview.innerHTML = `
          &lt;div class=&quot;upload-empty&quot;&gt;
            &lt;span class=&quot;upload-empty-icon&quot;&gt;+&lt;/span&gt;
            &lt;span class=&quot;upload-empty-text&quot;&gt;点击上传&lt;/span&gt;
          &lt;/div&gt;
        `;
      }
    }

    function openImagePreview(src) {
      if (!src) return;
      document.getElementById(&#x27;logoPreviewImage&#x27;).src = src;
      document.getElementById(&#x27;imagePreviewModal&#x27;).classList.add(&#x27;show&#x27;);
    }

    function previewLogoImage(event) {
      if (event) event.stopPropagation();
      openImagePreview(tempLogoData);
    }

    function previewClientImage(img) {
      if (!img || !img.src) return;
      openImagePreview(img.src);

    function ensurePaymentState(tab = paymentActiveTab) {
      const schema = paymentSchemas[tab];
      const state = paymentTabState[tab] || (paymentTabState[tab] = { density: &#x27;default&#x27;, visible: {} });
      if (!state.visible) state.visible = {};
      if (state.visible.selection === undefined) state.visible.selection = true;
      if (state.visible.sequence === undefined) state.visible.sequence = true;
      if (schema) {
        schema.columns.forEach(col =&gt; {
          if (state.visible[col.key] === undefined) state.visible[col.key] = true;
        });
      }
      if (!state.density) state.density = &#x27;default&#x27;;
      return state;
    }

    function switchPaymentTab(tab) {
      paymentActiveTab = tab;
      paymentCurrentPage = 1;
      document.querySelectorAll(&#x27;.payment-subnav-item&#x27;).forEach(btn =&gt; {
        btn.classList.toggle(&#x27;active&#x27;, btn.dataset.payTab === tab);

      closePayPanels();
      closePayStatus();
      syncPaymentRequirementDoc(tab);
      renderPayTable();
      showToast(`已切换到${getPaymentTabName(tab)}`);
    }

        route: &#x27;通道管理&#x27;,
        smallLimit: &#x27;小额充值限制&#x27;,
        group: &#x27;通道组管理&#x27;

        mount.innerHTML = renderSmallLimitPage();

    function renderPayPager() {
      document.querySelectorAll(&#x27;.payment-pagination .page-btn&#x27;).forEach(btn =&gt; {
        const page = Number(btn.textContent);
        btn.classList.toggle(&#x27;active&#x27;, page === paymentCurrentPage);
      });
    }

    function setPayPage(page) {
      paymentCurrentPage = Math.min(Math.max(Number(page) || 1, 1), 3);
      renderPayPager();
      showToast(`已切换到第 ${paymentCurrentPage} 页`);
    }

    function nextPayPage() {
      setPayPage(paymentCurrentPage &gt;= 3 ? 3 : paymentCurrentPage + 1);
    }

    function changePayPageSize() {
      paymentCurrentPage = 1;
      renderPayPager();
      const select = document.getElementById(&#x27;payPageSizeSelect&#x27;);
      const size = select ? select.value : &#x27;10&#x27;;
      showToast(`已切换为 ${size} 条/页`);
    }

    function handlePayJumpKey(event) {
      if (event.key !== &#x27;Enter&#x27;) return;
      const value = Number(event.target.value);
      if (!value) return;
      setPayPage(value);
      event.target.value = &#x27;&#x27;;
    }

        `&lt;th class=&quot;pay-col-sequence table-center ${state.visible.sequence ? &#x27;&#x27; : &#x27;pay-hidden-col&#x27;}&quot; data-pay-col=&quot;sequence&quot;&gt;序号&lt;/th&gt;`
      ];
      return base.concat(schema.columns.map(col =&gt; `&lt;th data-pay-col=&quot;${col.key}&quot; class=&quot;pay-col-${col.key} ${state.visible[col.key] ? &#x27;&#x27; : &#x27;pay-hidden-col&#x27;}&quot; style=&quot;width:${col.width}px&quot;&gt;${col.label}&lt;/th&gt;`)).join(&#x27;&#x27;);
    }

    function fillPaymentTable(tab = paymentActiveTab) {
      const body = document.getElementById(&#x27;payTableBody&#x27;);
      if (!body || !paymentSchemas[tab]) return;
      const rows = getPaymentRows(tab);
      const state = ensurePaymentState(tab);

      if (tab === &#x27;label&#x27;) renderPayCounts(rows);

      if (!rows.length) {
        const colspan = paymentSchemas[tab].columns.length + 2;
        body.innerHTML = `&lt;tr&gt;&lt;td colspan=&quot;${colspan}&quot; class=&quot;payment-empty-cell&quot;&gt;&lt;div class=&quot;empty-state&quot;&gt;&lt;div class=&quot;empty-icon&quot;&gt;▭&lt;/div&gt;&lt;div&gt;${paymentSchemas[tab].emptyText}&lt;/div&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;`;
      } else {
        body.innerHTML = rows.map((row, index) =&gt; `&lt;tr&gt;
          &lt;td data-pay-col=&quot;selection&quot; class=&quot;pay-col-selection table-center ${state.visible.selection ? &#x27;&#x27; : &#x27;pay-hidden-col&#x27;}&quot;&gt;&lt;input class=&quot;table-check pay-row-check&quot; type=&quot;checkbox&quot; data-pay-id=&quot;${row.id}&quot;&gt;&lt;/td&gt;
          &lt;td data-pay-col=&quot;sequence&quot; class=&quot;pay-col-sequence table-center ${state.visible.sequence ? &#x27;&#x27; : &#x27;pay-hidden-col&#x27;}&quot;&gt;${index + 1}&lt;/td&gt;
          ${paymentSchemas[tab].columns.map(col =&gt; `&lt;td data-pay-col=&quot;${col.key}&quot; class=&quot;pay-col-${col.key} ${state.visible[col.key] ? &#x27;&#x27; : &#x27;pay-hidden-col&#x27;}&quot;&gt;${formatPaymentCell(tab, col.key, row)}&lt;/td&gt;`).join(&#x27;&#x27;)}
        &lt;/tr&gt;`).join(&#x27;&#x27;);
      }

      const totalText = document.getElementById(&#x27;payTotalText&#x27;);
      if (totalText) totalText.textContent = `共 ${rows.length || (tab === &#x27;deposit&#x27; ? 0 : rows.length)} 条数据`;
      renderPayPager();
      applyPayDensity();
    }

    function getPaymentRows(tab) {
      const data = [...(paymentData[tab] || [])];
      const state = paymentTabState[tab] || {};
      const filtered = data.filter(row =&gt; {
        if (tab === &#x27;label&#x27;) {
          if (state.keyword &amp;&amp; !row.name.toLowerCase().includes(state.keyword.toLowerCase())) return false;
          if (state.status &amp;&amp; row.status !== state.status) return false;
          return true;
        }
        if (tab === &#x27;channel&#x27;) {
          if (state.keyword &amp;&amp; !(`${row.channel}${row.merchantId}${row.gateway}`.toLowerCase().includes(state.keyword.toLowerCase()))) return false;
          return true;
        }
        if (tab === &#x27;deposit&#x27;) {
          if (state.status &amp;&amp; row.status !== state.status) return false;
          if (state.keyword &amp;&amp; !(`${row.channel}${row.remark}`.toLowerCase().includes(state.keyword.toLowerCase()))) return false;
          return true;
        }
        if (tab === &#x27;route&#x27;) {
          if (state.name &amp;&amp; !row.name.toLowerCase().includes(state.name.toLowerCase())) return false;
          if (state.method &amp;&amp; row.method !== state.method) return false;
          if (state.channel &amp;&amp; row.channel !== state.channel) return false;
          if (state.status &amp;&amp; row.payStatus !== state.status) return false;
          return true;
        }
        if (tab === &#x27;group&#x27;) {
          if (state.keyword &amp;&amp; !(`${row.name}${row.method}${row.remark}`.toLowerCase().includes(state.keyword.toLowerCase()))) return false;
          if (state.method &amp;&amp; row.method !== state.method) return false;
          return true;
        }
        return true;
      });

      if (tab === &#x27;label&#x27;) {
        return filtered.sort((a, b) =&gt; {
          const sortA = Number(a.sort);
          const sortB = Number(b.sort);
          const safeA = Number.isFinite(sortA) ? sortA : 0;
          const safeB = Number.isFinite(sortB) ? sortB : 0;
          if (safeA !== safeB) return safeA - safeB;
          return (a.id || 0) - (b.id || 0);
        });
      }

      return filtered;
    }

    function formatPaymentCell(tab, key, row) {
      if (tab === &#x27;label&#x27; &amp;&amp; key === &#x27;sort&#x27;) {
        return `&lt;input class=&quot;pay-inline-sort-input&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;${row.sort ?? &#x27;&#x27;}&quot; onchange=&quot;updatePaymentInlineSort(${row.id}, this.value)&quot; onclick=&quot;event.stopPropagation()&quot;&gt;`;
      }
      if (key === &#x27;status&#x27; || key === &#x27;payStatus&#x27; || key === &#x27;customSwitch&#x27;) {
        const value = row[key] || row.status || &#x27;disabled&#x27;;
        return switchHtml(value, () =&gt; `togglePaymentStatus(&#x27;${tab}&#x27;, ${row.id}, &#x27;${key}&#x27;)`);
      }
      if (key === &#x27;action&#x27;) {
        const canDelete = [&#x27;label&#x27;, &#x27;route&#x27;, &#x27;group&#x27;].includes(tab);
        const del = canDelete ? `&lt;button type=&quot;button&quot; class=&quot;table-action-btn danger&quot; onclick=&quot;openPaymentDeleteConfirm(&#x27;${tab}&#x27;, ${row.id})&quot;&gt;删除&lt;/button&gt;` : &#x27;&#x27;;
        return `&lt;div class=&quot;table-action-group&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;table-action-btn edit&quot; onclick=&quot;openPayModal(&#x27;${tab}&#x27;,&#x27;edit&#x27;,${row.id})&quot;&gt;编辑&lt;/button&gt;${del}&lt;/div&gt;`;
      }
      if (key === &#x27;category&#x27;) return (row.category &amp;&amp; row.category.length) ? `&lt;span class=&quot;pay-multi-line&quot;&gt;${row.category.join(&#x27;，&#x27;)}&lt;/span&gt;` : &#x27;-&#x27;;
      if (key === &#x27;group&#x27;) return (row.group &amp;&amp; row.group.length) ? `&lt;span class=&quot;pay-multi-line&quot;&gt;${row.group.join(&#x27;，&#x27;)}&lt;/span&gt;` : &#x27;-&#x27;;
      if (key === &#x27;icon&#x27;) return `&lt;div class=&quot;pay-icon-preview&quot;&gt;${row.icon || &#x27;+&#x27;}&lt;/div&gt;`;
      if (key === &#x27;quality&#x27;) return row.quality || &#x27;否&#x27;;
      return row[key] ?? &#x27;-&#x27;;
    }

    function switchHtml(value, handler) {
      const enabled = value === &#x27;enabled&#x27; || value === &#x27;启用&#x27; || value === &#x27;开启&#x27;;
      return `&lt;span class=&quot;pay-switch ${enabled ? &#x27;enabled&#x27; : &#x27;disabled&#x27;}&quot; onclick=&quot;${handler()}&quot;&gt;
        &lt;span class=&quot;pay-switch-text&quot;&gt;${enabled ? &#x27;启用&#x27; : &#x27;停用&#x27;}&lt;/span&gt;&lt;span class=&quot;pay-switch-knob&quot;&gt;&lt;/span&gt;
      &lt;/span&gt;`;
    }

    function renderPayCounts() {
      const all = document.getElementById(&#x27;payCountAll&#x27;);
      if (!all) return;
      const allRows = paymentData.label || [];
      all.textContent = allRows.length;
      document.getElementById(&#x27;payCountEnabled&#x27;).textContent = allRows.filter(r =&gt; r.status === &#x27;enabled&#x27;).length;
      document.getElementById(&#x27;payCountDisabled&#x27;).textContent = allRows.filter(r =&gt; r.status === &#x27;disabled&#x27;).length;
    }

    function setPaymentStatusFilter(tab, value) {
      if (tab === &#x27;route&#x27;) paymentTabState.route.status = value;
      else paymentTabState[tab].status = value;
      fillPaymentTable(tab);
    }

    function setPayQuickFilter(status, btn) {
      paymentTabState.label.status = status;
      document.querySelectorAll(&#x27;[data-pay-filter]&#x27;).forEach(item =&gt; item.classList.remove(&#x27;active&#x27;));
      btn.classList.add(&#x27;active&#x27;);
      fillPaymentTable(&#x27;label&#x27;);
    }

    function resetPaymentFilters(tab) {
      if (tab === &#x27;label&#x27;) paymentTabState.label = { keyword: &#x27;&#x27;, status: &#x27;&#x27;, density: ensurePaymentState(&#x27;label&#x27;).density, visible: ensurePaymentState(&#x27;label&#x27;).visible };
      if (tab === &#x27;deposit&#x27;) paymentTabState.deposit = { status: &#x27;&#x27;, keyword: &#x27;&#x27;, density: ensurePaymentState(&#x27;deposit&#x27;).density, visible: ensurePaymentState(&#x27;deposit&#x27;).visible };
      if (tab === &#x27;route&#x27;) paymentTabState.route = { name: &#x27;&#x27;, method: &#x27;&#x27;, channel: &#x27;&#x27;, status: &#x27;&#x27;, density: ensurePaymentState(&#x27;route&#x27;).density, visible: ensurePaymentState(&#x27;route&#x27;).visible };
      if (tab === &#x27;group&#x27;) paymentTabState.group = { keyword: &#x27;&#x27;, method: &#x27;&#x27;, density: ensurePaymentState(&#x27;group&#x27;).density, visible: ensurePaymentState(&#x27;group&#x27;).visible };
      renderPayTable();
    }

    function refreshPayTable() {
      fillPaymentTable(paymentActiveTab);
      showToast(&#x27;刷新成功&#x27;);
    }

    function togglePayDensity(event) {
      event.stopPropagation();
      togglePayPanel(&#x27;payDensityPanel&#x27;, &#x27;payDensityBtn&#x27;);
    }

    function togglePayColumns(event) {
      event.stopPropagation();
      togglePayPanel(&#x27;payColumnsPanel&#x27;, &#x27;payColumnsBtn&#x27;);
    }

    function togglePayPanel(panelId, btnId) {
      const panel = document.getElementById(panelId);
      const btn = document.getElementById(btnId);
      if (!panel) return;
      const show = !panel.classList.contains(&#x27;show&#x27;);
      closePayPanels();
      if (show) {
        panel.classList.add(&#x27;show&#x27;);
        if (btn) btn.classList.add(&#x27;active&#x27;);
      }
    }

    function closePayPanels() {
      [&#x27;payDensityPanel&#x27;,&#x27;payColumnsPanel&#x27;].forEach(id =&gt; {
        const el = document.getElementById(id);
        if (el) el.classList.remove(&#x27;show&#x27;);
      });
      [&#x27;payDensityBtn&#x27;,&#x27;payColumnsBtn&#x27;].forEach(id =&gt; {
        const el = document.getElementById(id);
        if (el) el.classList.remove(&#x27;active&#x27;);
      });
    }

    function closePayStatus() {}

    function setPayDensity(type) {
      ensurePaymentState().density = type;
      applyPayDensity();
      closePayPanels();
      showToast(`已切换为${type === &#x27;default&#x27; ? &#x27;默认&#x27; : type === &#x27;medium&#x27; ? &#x27;中等&#x27; : &#x27;紧凑&#x27;}密度`);
    }

    function applyPayDensity() {
      const card = document.getElementById(&#x27;payTableCard&#x27;);
      if (!card) return;
      card.classList.remove(&#x27;density-default&#x27;,&#x27;density-medium&#x27;,&#x27;density-compact&#x27;);
      card.classList.add(`density-${ensurePaymentState().density}`);
      document.querySelectorAll(&#x27;[data-pay-density]&#x27;).forEach(btn =&gt; btn.classList.toggle(&#x27;active&#x27;, btn.dataset.payDensity === ensurePaymentState().density));
    }

    function togglePayColumn(key, checked) {
      ensurePaymentState().visible[key] = checked;
      fillPaymentTable(paymentActiveTab);
    }

    function resetPayColumns() {
      const state = ensurePaymentState();
      Object.keys(state.visible).forEach(key =&gt; state.visible[key] = true);
      renderPayTable();
      showToast(&#x27;列设置已重置&#x27;);
    }

    function togglePaySelectAll(checked) {
      document.querySelectorAll(&#x27;.pay-row-check&#x27;).forEach(input =&gt; input.checked = checked);
    }

    function updatePaymentInlineSort(id, value) {
      const row = (paymentData.label || []).find(item =&gt; item.id === id);
      if (!row) return;
      const parsed = Number(String(value).trim());
      row.sort = Number.isFinite(parsed) ? parsed : 0;
      paymentData.label.sort((a, b) =&gt; {
        const sortA = Number(a.sort);
        const sortB = Number(b.sort);
        const safeA = Number.isFinite(sortA) ? sortA : 0;
        const safeB = Number.isFinite(sortB) ? sortB : 0;
        if (safeA !== safeB) return safeA - safeB;
        return (a.id || 0) - (b.id || 0);
      });
      fillPaymentTable(&#x27;label&#x27;);
      showToast(&#x27;标签排序已更新&#x27;);
    }

    function togglePaymentStatus(tab, id, key) {
      const row = (paymentData[tab] || []).find(item =&gt; item.id === id);
      if (!row) return;
      const realKey = key === &#x27;status&#x27; ? &#x27;status&#x27; : key;
      row[realKey] = (row[realKey] === &#x27;enabled&#x27;) ? &#x27;disabled&#x27; : &#x27;enabled&#x27;;
      fillPaymentTable(tab);
    }

    function openPaymentDeleteConfirm(tab, id) {
      const rows = paymentData[tab] || [];
      const row = rows.find(item =&gt; item.id === id) || {};
      const name = row.name || row.channel || row.remark || row.id || &#x27;当前数据&#x27;;
      openCommonConfirm({
        title: &#x27;确认删除&#x27;,
        text: `删除后该条数据将从列表中移除，确认删除 &lt;strong&gt;「${name}」&lt;/strong&gt; 吗？`,
        confirmText: &#x27;确认删除&#x27;,
        variant: &#x27;danger&#x27;,
        onConfirm: () =&gt; deletePaymentRow(tab, id)
      });
    }

    function deletePaymentRow(tab, id) {
      paymentData[tab] = (paymentData[tab] || []).filter(item =&gt; item.id !== id);
      fillPaymentTable(tab);
      showToast(&#x27;删除成功&#x27;);
    }

          &lt;div class=&quot;small-row required&quot;&gt;&lt;label&gt;第一步：&lt;/label&gt;&lt;div&gt;充值金额小于 &lt;input class=&quot;inline-input&quot; value=&quot;100&quot;&gt;，成功充值 &lt;input class=&quot;inline-input&quot; value=&quot;2&quot;&gt; 次后，将该玩家的最低充值金额小于100的通道中的最低充值金额改为100；&lt;/div&gt;&lt;/div&gt;

          &lt;div class=&quot;small-row required&quot;&gt;&lt;label&gt;第三步：&lt;/label&gt;&lt;div&gt;充值金额大于等于 &lt;input class=&quot;inline-input&quot; value=&quot;200&quot;&gt;，成功充值 &lt;input class=&quot;inline-input&quot; value=&quot;2&quot;&gt; 次后，只显示手续费小于 &lt;input class=&quot;inline-input short&quot; value=&quot;10&quot;&gt; %的通道，且将其中最低充值金额小于 &lt;input class=&quot;inline-input&quot; value=&quot;100&quot;&gt; 的通道中的最低充值金额改为100&lt;/div&gt;&lt;/div&gt;

    function openPayEdit(id) {
      openPayModal(&#x27;label&#x27;, id ? &#x27;edit&#x27; : &#x27;add&#x27;, id);
    }

    function openPayModal(tab, mode = &#x27;add&#x27;, id = null) {
      currentPayModal = { tab, mode, id };
      const row = mode === &#x27;edit&#x27; ? ((paymentData[tab] || []).find(item =&gt; item.id === id) || {}) : {};
      payModalDraft = {
        labelCategory: tab === &#x27;label&#x27; &amp;&amp; mode === &#x27;edit&#x27; ? [...(row.category || [])] : [],
        labelGroup: tab === &#x27;label&#x27; &amp;&amp; mode === &#x27;edit&#x27; ? [...(row.group || [])] : [],
        routeDisplayMode: tab === &#x27;route&#x27; ? (mode === &#x27;edit&#x27; ? (row.displayMode || &#x27;unlimited&#x27;) : &#x27;unlimited&#x27;) : &#x27;&#x27;,
        route_displayAgent: tab === &#x27;route&#x27; &amp;&amp; mode === &#x27;edit&#x27; ? (Array.isArray(row.displayAgent) ? [...row.displayAgent] : (row.displayAgent ? [row.displayAgent] : [])) : [],
        route_displayChannel: tab === &#x27;route&#x27; &amp;&amp; mode === &#x27;edit&#x27; ? (Array.isArray(row.displayChannel) ? [...row.displayChannel] : (row.displayChannel ? [row.displayChannel] : [])) : [],

        routeDiscountRange: tab === &#x27;route&#x27; ? (mode === &#x27;edit&#x27; ? (row.discountRange || &#x27;enabled&#x27;) : &#x27;disabled&#x27;) : &#x27;&#x27;,
        routeDiscountConfig: tab === &#x27;route&#x27; &amp;&amp; mode === &#x27;edit&#x27; ? {
          member: row.discountMember || &#x27;所有&#x27;,
          min: row.discountMin || &#x27;10&#x27;,
          max: row.discountMax || &#x27;100000&#x27;,
          method: row.discountMethod || &#x27;百分比&#x27;,
          plan: row.discountPlan || &#x27;每次&#x27;,
          amount: row.discountAmount || &#x27;2&#x27;,
          cap: row.discountCap || &#x27;888&#x27;,
          remark: row.discountRemark || &#x27;钱包存款赠送2%&#x27;,
          multiple: row.discountMultiple || &#x27;1&#x27;
        } : {
          member: &#x27;&#x27;,
          min: &#x27;&#x27;,
          max: &#x27;&#x27;,
          method: &#x27;&#x27;,
          plan: &#x27;&#x27;,
          amount: &#x27;&#x27;,
          cap: &#x27;&#x27;,
          remark: &#x27;&#x27;,
          multiple: &#x27;&#x27;
        },
        uploads: {
          routeIcon: tab === &#x27;route&#x27; &amp;&amp; mode === &#x27;edit&#x27; ? (row.icon || &#x27;&#x27;) : &#x27;&#x27;,

      };
      payModalOpenSingleKey = &#x27;&#x27;;
      payModalOpenMultiKey = &#x27;&#x27;;
      const titleMap = { label: &#x27;标签&#x27;, channel: &#x27;渠道&#x27;, deposit: &#x27;渠道押金&#x27;, route: &#x27;通道&#x27;, group: &#x27;通道组&#x27; };
      document.getElementById(&#x27;payEditTitle&#x27;).textContent = `${mode === &#x27;add&#x27; ? &#x27;添加&#x27; : &#x27;编辑&#x27;}${titleMap[tab] || &#x27;&#x27;}`;

    function closePayEdit(event) {
      if (event &amp;&amp; event.target !== document.getElementById(&#x27;payEditModal&#x27;)) return;

    function getEditRow(tab, mode, id) {

    function renderPayModalBody(tab, mode, id) {
      const row = getEditRow(tab, mode, id);
      if (tab === &#x27;label&#x27;) return renderLabelModal(row, mode);
      if (tab === &#x27;channel&#x27;) return renderChannelModal(row, mode);

    function field(label, value = &#x27;&#x27;, placeholder = &#x27;请输入&#x27;, required = false, extra = &#x27;&#x27;) {

    function getPayModalSingleValue(key, defaultValue = &#x27;&#x27;) {

    function selectField(label, value = &#x27;&#x27;, options = [], required = false, placeholder = &#x27;请选择&#x27;, fieldKey = &#x27;&#x27;) {
      const key = fieldKey || `single_${label}`;
      const currentValue = getPayModalSingleValue(key, value || &#x27;&#x27;);
      const openClass = payModalOpenSingleKey === key ? &#x27;open&#x27; : &#x27;&#x27;;

        const isSelected = option === currentValue;
        return `&lt;div class=&quot;mock-option ${isSelected ? &#x27;selected&#x27; : &#x27;&#x27;}&quot; onclick=&quot;event.stopPropagation();selectPayModalSingle(&#x27;${key}&#x27;, &#x27;${encodeURIComponent(option)}&#x27;)&quot;&gt;&lt;span&gt;${option}&lt;/span&gt;${isSelected ? &#x27;&lt;b&gt;✓&lt;/b&gt;&#x27; : &#x27;&#x27;}&lt;/div&gt;`;
      }).join(&#x27;&#x27;);
      return `&lt;div class=&quot;pay-form-label&quot;&gt;${required ? &#x27;&lt;span class=&quot;required-star&quot;&gt;*&lt;/span&gt;&#x27; : &#x27;&#x27;}${label}：&lt;/div&gt;
        &lt;div class=&quot;pay-form-control&quot;&gt;
          &lt;div class=&quot;mock-select-field ${emptyClass} ${openClass}&quot; onclick=&quot;event.stopPropagation();togglePayModalSingleDropdown(&#x27;${key}&#x27;)&quot;&gt;

            &lt;span class=&quot;mock-select-arrow&quot;&gt;⌄&lt;/span&gt;
            &lt;div class=&quot;mock-select-dropdown&quot; onclick=&quot;event.stopPropagation()&quot;&gt;${dropdown || &#x27;&lt;div class=&quot;mock-option&quot;&gt;&lt;span&gt;暂无数据&lt;/span&gt;&lt;/div&gt;&#x27;}&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;`;

    function togglePayModalSingleDropdown(key) {

      payModalOpenMultiKey = &#x27;&#x27;;
      rerenderPayModalBody();

    function selectPayModalSingle(key, encodedValue) {
      payModalDraft[key] = decodeURIComponent(encodedValue);

      }).join(&#x27;&#x27;);

          multiple: row.discountMultiple || &#x27;1&#x27;

          min: &#x27;&#x27;,
          max: &#x27;&#x27;,
          method: &#x27;&#x27;,
          plan: &#x27;&#x27;,
          amount: &#x27;&#x27;,
          cap: &#x27;&#x27;,
          remark: &#x27;&#x27;,
          multiple: &#x27;&#x27;

      rerenderPayModalBody();

      const emptyClass = currentValue ? &#x27;&#x27; : &#x27;empty&#x27;;
      const dropdown = options.map(option =&gt; {

        return `&lt;div class=&quot;mock-option ${isSelected ? &#x27;selected&#x27; : &#x27;&#x27;}&quot; onclick=&quot;event.stopPropagation();selectRouteDiscountConfig(&#x27;${key}&#x27;, &#x27;${encodeURIComponent(option)}&#x27;)&quot;&gt;&lt;span&gt;${option}&lt;/span&gt;${isSelected ? &#x27;&lt;b&gt;✓&lt;/b&gt;&#x27; : &#x27;&#x27;}&lt;/div&gt;`;
      }).join(&#x27;&#x27;);

        &lt;div class=&quot;mock-select-value&quot;&gt;${currentValue ? currentValue : `&lt;span class=&quot;placeholder&quot;&gt;${placeholder}&lt;/span&gt;`}&lt;/div&gt;

              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;`;

    height: 78px;
    padding: 6px 14px 8px;
    background: rgba(255, 255, 255, .96);
    border-top: 1px solid #dceaf7;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: end;
    backdrop-filter: blur(12px);
  }
  .task-h5-nav-item {

    line-height: 1;

  }

    height: 68px;

      .requirement-doc-header { padding: 20px; }

  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;main class=&quot;standalone-shell&quot;&gt;

    &lt;div class=&quot;standalone-layout&quot;&gt;
      &lt;section class=&quot;prototype-column&quot; aria-label=&quot;H5端页面原型&quot;&gt;
        &lt;div id=&quot;h5PrototypeRoot&quot;&gt;&lt;/div&gt;
      &lt;/section&gt;
      &lt;aside class=&quot;requirements-column&quot; aria-label=&quot;H5端需求文档&quot;&gt;
        &lt;article class=&quot;requirement-doc&quot;&gt;
          &lt;header class=&quot;requirement-doc-header&quot;&gt;
            &lt;div class=&quot;requirement-doc-kicker&quot;&gt;H5端需求文档&lt;/div&gt;
            &lt;h2&gt;运营管理 / 任务配置 / H5端&lt;/h2&gt;
            &lt;div class=&quot;requirement-doc-subtitle&quot;&gt;当前文件仅展示H5端原型及对应需求文档。&lt;/div&gt;
          &lt;/header&gt;
          &lt;div class=&quot;requirement-doc-body&quot;&gt;

              &lt;section class=&quot;req-section&quot;&gt;
                &lt;h3&gt;需求背景&lt;/h3&gt;
                &lt;p&gt;H5 端集中展示任务、活跃度、奖励及宝箱状态，并与后台配置和用户行为实时联动。&lt;/p&gt;
              &lt;/section&gt;

              &lt;section class=&quot;req-section&quot;&gt;
                &lt;h3&gt;功能清单&lt;/h3&gt;
                &lt;ul class=&quot;req-list&quot;&gt;
                  &lt;li&gt;数据概览：今日存款、今日有效投注、当前活跃度及刷新倒计时。&lt;/li&gt;
                  &lt;li&gt;宝箱：展示解锁积分、奖励及未解锁、已解锁、已开启状态。&lt;/li&gt;
                  &lt;li&gt;任务：支持分类、进度、说明、奖励展示及完成/领取交互。&lt;/li&gt;
                  &lt;li&gt;刷新：任务每日 00:00:00 刷新；未领取宝箱按最晚领取规则处理。&lt;/li&gt;
                &lt;/ul&gt;
              &lt;/section&gt;

              &lt;section class=&quot;req-section&quot;&gt;
                &lt;h3&gt;验收标准&lt;/h3&gt;
                &lt;ul class=&quot;req-list&quot;&gt;
                  &lt;li&gt;展示内容、顺序及奖励与后台有效配置一致。&lt;/li&gt;
                  &lt;li&gt;进度和状态实时更新，奖励不可重复领取。&lt;/li&gt;
                  &lt;li&gt;修改后未完成内容按新配置计算；已完成、已解锁及已领取内容保留。&lt;/li&gt;
                  &lt;li&gt;删除后未完成任务和未解锁宝箱移除；已完成或已领取记录保留。&lt;/li&gt;
                  &lt;li&gt;同一用户已完成的一次性任务或相同条件任务不重复展示、完成或发奖。&lt;/li&gt;
                  &lt;li&gt;分类筛选及任务、宝箱滑动交互正常。&lt;/li&gt;
                &lt;/ul&gt;
              &lt;/section&gt;

              &lt;section class=&quot;req-section&quot;&gt;
                &lt;h3&gt;一、宝箱区域&lt;/h3&gt;
                &lt;ul class=&quot;req-list&quot;&gt;
                  &lt;li&gt;&lt;b&gt;今日存款：&lt;/b&gt;固定展示当日已领取宝箱彩金与任务彩金总和；无数据为 0，领取后实时更新。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;今日有效投注：&lt;/b&gt;固定展示当日任务游戏类型已结算注单的有效投注总额；无数据为 0。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;当前活跃度：&lt;/b&gt;展示当日已领取活跃度积分总和；无数据为 0，活跃度 ICON 固定展示。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;倒计时：&lt;/b&gt;展示距离次日 00:00:00 的时、分、秒。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;宝箱展示：&lt;/b&gt;按解锁积分升序横向展示；状态为【未解锁】【已解锁】【已开启】。奖励读取【发放金额】，解锁积分读取【解锁宝箱积分数值】。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;未解锁：&lt;/b&gt;点击提示【打开后获得XX彩金，需X倍流水可提现】，状态不变。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;已解锁：&lt;/b&gt;点击发放奖励并提示【已获得XX彩金，需X倍流水可提现】，成功后变为【已开启】。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;已开启：&lt;/b&gt;不可重复发奖；点击提示【已获得XX彩金，需X倍流水可提现】。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;最晚领取：&lt;/b&gt;已达标宝箱最晚需在次日 1 点前领取，逾期清零作废。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;刷新：&lt;/b&gt;任务每日 00:00:00 刷新；上一日有未领取宝箱时，宝箱状态及相关数据保留至最晚领取截止时间，否则按新一轮规则刷新。&lt;/li&gt;
                &lt;/ul&gt;
              &lt;/section&gt;

              &lt;section class=&quot;req-section&quot;&gt;
                &lt;h3&gt;二、任务区域&lt;/h3&gt;
                &lt;ul class=&quot;req-list&quot;&gt;
                  &lt;li&gt;&lt;b&gt;任务分类：&lt;/b&gt;【全部任务】固定展示；【新人专享】对应任务列表任务，【游戏类型】对应每日投注任务中的游戏类型，【每日存款】对应每日存款任务；对应分类无有效任务时不展示，超出区域可左右滑动。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;排序：&lt;/b&gt;全部任务按新人专享、游戏类型、每日存款排列；列表内不显示分类标题。新人任务按添加顺序，游戏类型按后台顺序且目标升序，每日存款按目标升序。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;任务卡片：&lt;/b&gt;展示进度、标题、说明、活跃度、奖金及操作；未配置的活跃度或奖金不展示。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;字段来源：&lt;/b&gt;标题与说明读取【编辑文案详情】；活跃度和奖金读取对应任务配置。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;进度：&lt;/b&gt;数值任务按当前值÷目标×100%计算，最高 100%；状态任务未完成为 0%，完成为 100%。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;随机奖金：&lt;/b&gt;固定奖金展示固定金额；随机奖金展示配置范围。领取时在真实奖金范围内随机一次，到账后结果固定。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;防重复：&lt;/b&gt;注册、首次存款、首次提款及相同完善资料条件、相同 APP 充值条件，同一用户仅完成和发奖一次。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;状态：&lt;/b&gt;未完成显示【去完成】；达到条件显示【已完成】，点击确认后发放奖励并更新状态。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;刷新：&lt;/b&gt;任务进度实时更新，并于每日 00:00:00 刷新新一轮数据。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;空状态：&lt;/b&gt;分类无有效任务时展示统一空状态。&lt;/li&gt;
                &lt;/ul&gt;
              &lt;/section&gt;

              &lt;section class=&quot;req-section&quot;&gt;
                &lt;h3&gt;三、全局逻辑&lt;/h3&gt;
                &lt;ul class=&quot;req-list&quot;&gt;
                  &lt;li&gt;&lt;b&gt;进度：&lt;/b&gt;任务实时更新并每日刷新；配置修改后未完成内容重算，已完成、已解锁及已领取状态保留。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;多任务进度：&lt;/b&gt;每日投注按同游戏类型共享当日有效投注进度，每日存款共享当日累计存款进度；各任务按目标独立计算，达到高目标时同步完成低目标任务。&lt;div style=&quot;margin-top:6px; padding-left:14px; display:grid; gap:5px;&quot;&gt;&lt;div&gt;&lt;b&gt;每日投注进度：&lt;/b&gt;min（当日同游戏类型累计有效投注金额 ÷ 任务目标 × 100%，100%）。&lt;/div&gt;&lt;div&gt;&lt;b&gt;每日存款进度：&lt;/b&gt;min（当日累计存款金额 ÷ 任务目标 × 100%，100%）。&lt;/div&gt;&lt;div&gt;进度达到 100% 时任务完成。&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;奖励打码倍数：&lt;/b&gt;倍数为 0 时无需打码，可直接提现；大于 0 时按奖励金额 × 倍数完成有效投注。&lt;/li&gt;
                  &lt;li&gt;&lt;b&gt;未领取宝箱：&lt;/b&gt;保留至次日 1 点前，不计入新一日数据；逾期清零且不补发。&lt;/li&gt;
                &lt;/ul&gt;
              &lt;/section&gt;
          &lt;/div&gt;
        &lt;/article&gt;
      &lt;/aside&gt;
    &lt;/div&gt;
  &lt;/main&gt;

  &lt;div class=&quot;toast&quot; id=&quot;toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

    function showToast(message) {
      const toast = document.getElementById(&#x27;toast&#x27;);
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add(&#x27;show&#x27;);
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() =&gt; toast.classList.remove(&#x27;show&#x27;), 2200);
    }

    function handleH5ChestClick(chest) {
      if (!chest) return;
      const state = chest.dataset.state;
      const bonus = chest.dataset.bonus || &#x27;XX&#x27;;
      const multiple = chest.dataset.multiple || &#x27;X&#x27;;

      if (state === &#x27;locked&#x27;) {
        showToast(`打开后获得${bonus}彩金，需${multiple}倍流水可提现`);
        return;
      }

      if (state === &#x27;unlocked&#x27;) {
        chest.dataset.state = &#x27;opened&#x27;;
        chest.classList.remove(&#x27;is-unlocked&#x27;);
        chest.classList.add(&#x27;is-opened&#x27;);
        chest.setAttribute(&#x27;aria-label&#x27;, &#x27;宝箱已开启，点击查看奖励提示&#x27;);
        chest.setAttribute(&#x27;aria-disabled&#x27;, &#x27;false&#x27;);
        const tag = chest.querySelector(&#x27;.task-h5-chest-tag&#x27;);
        if (tag) tag.textContent = &#x27;已开启&#x27;;
        showToast(`已获得${bonus}彩金，需${multiple}倍流水可提现`);
        return;
      }

      if (state === &#x27;opened&#x27;) {
        showToast(`已获得${bonus}彩金，需${multiple}倍流水可提现`);
      }
    }

    function handleH5TaskCategoryClick(button) {
      if (!button) return;
      const shell = button.closest(&#x27;.task-h5-category-shell&#x27;);
      if (!shell) return;
      const category = button.dataset.taskCategory || &#x27;all&#x27;;

      shell.querySelectorAll(&#x27;.task-h5-category&#x27;).forEach(item =&gt; {
        const active = item === button;
        item.classList.toggle(&#x27;active&#x27;, active);
        item.setAttribute(&#x27;aria-selected&#x27;, active ? &#x27;true&#x27; : &#x27;false&#x27;);
      });

      let visibleCount = 0;
      shell.querySelectorAll(&#x27;[data-task-group]&#x27;).forEach(group =&gt; {
        const visible = category === &#x27;all&#x27; || group.dataset.taskGroup === category;
        group.hidden = !visible;
        if (visible) visibleCount += 1;
      });

      const empty = shell.querySelector(&#x27;[data-task-empty]&#x27;);
      if (empty) empty.classList.toggle(&#x27;active&#x27;, visibleCount === 0);
      button.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;nearest&#x27;, inline: &#x27;center&#x27; });
    }
